name: Agent Task
description: Structured issue template for Claude/Codex workstreams.
title: "[Task] "
labels:
  - agent-ready
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this issue produce?
      placeholder: Describe the intended result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context And Constraints
      description: Relevant product context, constraints, dependencies, or non-goals.
      placeholder: Include anything an agent or teammate must know before starting.
    validations:
      required: true
  - type: checkboxes
    id: touched_areas
    attributes:
      label: Expected Areas
      description: Select the parts of the repo likely to change.
      options:
        - label: Apps Script bootstrap (`Code.gs`)
        - label: Apps Script data loading (`DashboardDataLoading.gs`)
        - label: Apps Script package rules or projection (`DashboardPackages.gs` or `DashboardProjection.gs`)
        - label: Apps Script student queue, calendar, analytics, or state (`DashboardAnalytics.gs` or `DashboardState.gs`)
        - label: Shared backend helpers (`SharedHelpers.gs`)
        - label: Dashboard frontend (`dashboard.html`)
        - label: Apps Script config (`appsscript.json` or `.clasp.json`)
        - label: Documentation or workflow files
        - label: GitHub workflow or templates
  - type: textarea
    id: ownership
    attributes:
      label: Ownership And Parallelization Notes
      description: Note expected file ownership, disjoint scopes, or overlap risks.
      placeholder: Example: agent owns DashboardAnalytics.gs only; avoid SharedHelpers.gs and workflow docs in this task.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition Of Done
      description: What must be true before this issue is complete?
      placeholder: Include validation, Apps Script push expectations, and whether a fresh web app deployment is required.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation Impact
      description: What docs must be updated if this task changes workflow, setup, deployment, or structure?
      placeholder: State `none` only if there is no documentation impact.
    validations:
      required: true
