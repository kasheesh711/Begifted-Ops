<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeGifted - Credit Control Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f0e8;
    --bg-strong: #ece4d8;
    --surface: #fffdf9;
    --surface-muted: #f7f2ea;
    --surface-alt: #f1ebdf;
    --navy: #0d3b73;
    --navy-deep: #082847;
    --navy-soft: #e7eef9;
    --orange: #f36a1d;
    --orange-soft: #fff1e7;
    --red: #c63d31;
    --red-soft: #fbe9e7;
    --yellow: #d28b15;
    --yellow-soft: #fff6df;
    --green: #1d7a4f;
    --green-soft: #e8f6ef;
    --ink: #1d2230;
    --ink-soft: #5d6473;
    --ink-faint: #8e95a3;
    --border: rgba(16, 24, 40, 0.08);
    --border-strong: rgba(16, 24, 40, 0.14);
    --shadow: 0 10px 24px rgba(14, 22, 36, 0.06);
    --shadow-soft: 0 2px 10px rgba(14, 22, 36, 0.04);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(243,106,29,0.08), transparent 24%),
      radial-gradient(circle at top right, rgba(13,59,115,0.08), transparent 28%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.5;
  }

  button, input { font: inherit; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 24px;
    background: rgba(244, 240, 232, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(16, 24, 40, 0.08);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--orange), #ff9652);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    letter-spacing: -0.04em;
    box-shadow: 0 12px 24px rgba(243, 106, 29, 0.22);
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .brand-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .view-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(16, 24, 40, 0.08);
    box-shadow: var(--shadow-soft);
  }

  .view-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.16s ease;
  }

  .view-btn.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 8px 18px rgba(13, 59, 115, 0.2);
  }

  .topbar-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .meta-pill {
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(16, 24, 40, 0.08);
    font-size: 12px;
    color: var(--ink-soft);
  }

  .workspace {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 22px;
    padding: 22px;
  }

  .rail {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: calc(100vh - 108px);
  }

  .panel {
    background: rgba(255, 253, 249, 0.92);
    border: 1px solid rgba(16, 24, 40, 0.08);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  .rail-panel {
    padding: 18px;
  }

  .panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
    color: var(--ink-faint);
  }

  .panel-caption {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .search-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: var(--surface-muted);
    color: var(--ink);
    outline: none;
  }

  .search-input:focus {
    border-color: var(--navy);
    background: white;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .filter-chip {
    border: 1px solid rgba(16, 24, 40, 0.08);
    border-radius: 16px;
    background: white;
    padding: 12px;
    cursor: pointer;
    transition: 0.16s ease;
    text-align: left;
  }

  .filter-chip.active {
    border-color: rgba(13, 59, 115, 0.28);
    background: var(--navy-soft);
    box-shadow: inset 0 0 0 1px rgba(13, 59, 115, 0.08);
  }

  .chip-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .chip-count {
    margin-top: 4px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .student-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 56vh;
    overflow: auto;
  }

  .student-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 16px;
    border: 1px solid transparent;
    background: rgba(241, 235, 223, 0.36);
    cursor: pointer;
    transition: 0.16s ease;
  }

  .student-row:hover,
  .student-row.active {
    background: white;
    border-color: rgba(13, 59, 115, 0.16);
    transform: translateY(-1px);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: -0.04em;
    flex-shrink: 0;
  }

  .student-copy {
    min-width: 0;
    flex: 1;
  }

  .student-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-sub {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .student-meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .status-pill,
  .flag-pill,
  .delta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .status-pill.notify,
  .tone-critical {
    background: var(--red-soft);
    color: var(--red);
  }

  .status-pill.watch,
  .tone-warning {
    background: var(--yellow-soft);
    color: var(--yellow);
  }

  .status-pill.ok,
  .tone-positive {
    background: var(--green-soft);
    color: var(--green);
  }

  .status-pill.nodata,
  .tone-info {
    background: var(--navy-soft);
    color: var(--navy);
  }

  .delta-pill {
    background: rgba(255, 255, 255, 0.72);
    color: var(--ink-soft);
  }

  .flag-pill {
    background: var(--surface-alt);
    color: var(--ink-soft);
    padding: 5px 10px;
  }

  .mini-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .main-area {
    min-width: 0;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .metric-card {
    padding: 18px;
    border-radius: var(--radius-lg);
    background: rgba(255, 253, 249, 0.92);
    border: 1px solid rgba(16, 24, 40, 0.08);
    box-shadow: var(--shadow);
  }

  .metric-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 800;
    color: var(--ink-faint);
  }

  .metric-value {
    margin-top: 10px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
  }

  .metric-sub {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .command-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) 360px;
    gap: 18px;
  }

  .queue-panel,
  .context-column,
  .analytics-grid,
  .detail-layout {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .queue-card {
    padding: 18px;
  }

  .queue-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }

  .queue-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .queue-subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .queue-count {
    padding: 9px 12px;
    border-radius: 999px;
    background: var(--surface-muted);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
  }

  .queue-table-wrap {
    overflow: auto;
    border-radius: 18px;
    border: 1px solid rgba(16, 24, 40, 0.06);
    background: white;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    padding: 14px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    background: var(--surface-muted);
    position: sticky;
    top: 0;
    z-index: 2;
    cursor: pointer;
  }

  th.no-sort { cursor: default; }

  td {
    padding: 14px 16px;
    border-top: 1px solid rgba(16, 24, 40, 0.06);
    vertical-align: top;
    font-size: 13px;
  }

  .queue-row {
    cursor: pointer;
    transition: 0.14s ease;
  }

  .queue-row:hover,
  .queue-row.active {
    background: rgba(231, 238, 249, 0.78);
  }

  .queue-primary {
    font-weight: 700;
  }

  .queue-secondary {
    margin-top: 4px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .mono {
    font-family: "DM Mono", monospace;
  }

  .context-card {
    padding: 18px;
  }

  .context-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .context-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .context-subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .context-grid {
    display: grid;
    gap: 14px;
  }

  .context-block {
    padding: 14px;
    border-radius: 16px;
    background: var(--surface-muted);
  }

  .context-block h4,
  .analytics-card h3,
  .detail-card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 800;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }

  .context-hero {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .context-stat {
    padding: 12px;
    border-radius: 14px;
    background: white;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .context-stat-label {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 800;
  }

  .context-stat-value {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .action-btn,
  .ghost-btn {
    border: none;
    border-radius: 14px;
    padding: 12px 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.14s ease;
  }

  .action-btn {
    background: var(--orange);
    color: white;
    box-shadow: 0 12px 24px rgba(243, 106, 29, 0.18);
  }

  .ghost-btn {
    background: white;
    color: var(--navy);
    border: 1px solid rgba(13, 59, 115, 0.12);
  }

  .insight-list,
  .driver-list,
  .segment-list,
  .upcoming-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .insight-row,
  .driver-row,
  .segment-row,
  .upcoming-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: white;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .insight-copy,
  .segment-copy {
    min-width: 0;
    flex: 1;
  }

  .insight-name,
  .segment-name {
    font-size: 13px;
    font-weight: 700;
  }

  .insight-detail,
  .segment-detail {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 3px;
  }

  .insight-value,
  .segment-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
    text-align: right;
  }

  .analytics-grid {
    display: grid;
    gap: 18px;
  }

  .analytics-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .analytics-card,
  .detail-card {
    padding: 20px;
  }

  .chart-shell {
    padding: 14px;
    border-radius: 18px;
    background: var(--surface-muted);
    border: 1px solid rgba(16, 24, 40, 0.05);
  }

  .chart-labels,
  .bar-list {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .legend-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .segment-bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .segment-bar-track,
  .hist-bar-track,
  .week-bar-track {
    height: 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    overflow: hidden;
  }

  .segment-bar-fill,
  .hist-bar-fill,
  .week-bar-fill {
    height: 100%;
    border-radius: 999px;
  }

  .hist-grid,
  .week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 12px;
  }

  .hist-cell,
  .week-cell {
    padding: 12px;
    border-radius: 16px;
    background: white;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .hist-value,
  .week-value {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .heatmap-cell {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.5);
  }

  .detail-header {
    padding: 20px;
  }

  .detail-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .back-btn {
    border: none;
    background: var(--navy-soft);
    color: var(--navy);
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .detail-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.05em;
  }

  .detail-sub {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .detail-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-top: 18px;
  }

  .detail-summary-card {
    padding: 14px;
    border-radius: 16px;
    background: var(--surface-muted);
  }

  .detail-summary-card .metric-label {
    margin-bottom: 8px;
  }

  .package-stack {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .package-card {
    padding: 20px;
  }

  .package-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .package-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .package-subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .package-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .stat-card {
    padding: 12px;
    border-radius: 14px;
    background: white;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 800;
  }

  .stat-value {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .waterfall {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .waterfall-row {
    display: grid;
    grid-template-columns: 120px 1fr 64px;
    gap: 12px;
    align-items: center;
  }

  .waterfall-label {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .waterfall-track {
    height: 12px;
    border-radius: 999px;
    background: var(--surface-alt);
    overflow: hidden;
  }

  .waterfall-fill {
    height: 100%;
    border-radius: 999px;
  }

  .waterfall-value {
    text-align: right;
    font-weight: 800;
    font-size: 12px;
  }

  .projection-table {
    margin-top: 12px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .projection-table table td,
  .projection-table table th {
    padding: 10px 12px;
    font-size: 12px;
  }

  .projection-bars {
    display: flex;
    gap: 8px;
    align-items: end;
    min-height: 120px;
  }

  .projection-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .projection-bar {
    width: 100%;
    max-width: 34px;
    border-radius: 12px 12px 8px 8px;
  }

  .projection-label {
    font-size: 11px;
    color: var(--ink-faint);
  }

  .empty-state {
    padding: 28px;
    text-align: center;
    color: var(--ink-soft);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 15, 24, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 70;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    width: min(560px, 100%);
    padding: 24px;
    border-radius: 24px;
    background: white;
    box-shadow: 0 20px 40px rgba(8, 15, 24, 0.2);
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 14px;
  }

  .modal-msg {
    padding: 16px;
    border-radius: 16px;
    background: var(--surface-muted);
    border: 1px solid rgba(16, 24, 40, 0.06);
    white-space: pre-wrap;
    line-height: 1.7;
    color: var(--ink);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-btn {
    border: none;
    padding: 11px 16px;
    border-radius: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-btn.secondary {
    background: var(--surface-muted);
    color: var(--ink-soft);
  }

  .modal-btn.primary {
    background: var(--orange);

  }

  @media (max-width: 1380px) {

  @media (max-width: 1120px) {

    .student-list { max-height: none; }
  }

  @media (max-width: 760px) {
    .topbar {

      align-items: stretch;
    }

    .context-hero,
    .stat-grid {

    }

    .filter-grid { grid-template-columns: 1fr; }
    .waterfall-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">BG</div>
      <div>
        <div class="brand-title">BeGifted Credit Control</div>
        <div class="brand-subtitle">Action-first package monitoring and analytics</div>
      </div>
    </div>

    <div class="view-switch">
      <button class="view-btn active" id="view-command" onclick="setView('command')">Command Center</button>
      <button class="view-btn" id="view-analytics" onclick="setView('analytics')">Analytics</button>
      <button class="view-btn" id="view-student" onclick="currentView==='student' ? setView('student') : null">Student Detail</button>
    </div>

      <span class="meta-pill" id="comparison-label"></span>

  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">

      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn primary" id="modal-copy-btn" onclick="copyMsg()">Copy message</button>
      </div>
    </div>
  </div>

<script>
const DATA = JSON.parse(<?= JSON.stringify(getStudentData()) ?>);

let currentView = "command";
let currentFilter = "all";
let currentSearch = "";
let currentSort = { field: "priorityScore", dir: "desc" };
let selectedQueueKey = DATA.actionQueue.length ? DATA.actionQueue[0].key : null;
let selectedStudentIndex = null;

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[character];
  });
}

function formatNumber(value) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
  const numeric = Number(value);
  return Number.isInteger(numeric) ? String(numeric) : numeric.toFixed(1);
}

function formatSigned(value, suffix) {
  if (value === null || value === undefined) return "Baseline";
  const numeric = Number(value);
  const sign = numeric > 0 ? "+" : "";
  return sign + formatNumber(numeric) + (suffix || "");
}

function formatDate(dateString) {
  if (!dateString) return "No date";
  return new Date(dateString).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric",
  });
}

function formatShortDate(dateString) {
  if (!dateString) return "No date";
  return new Date(dateString).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
  });
}

function formatDateTime(dateString) {
  if (!dateString) return "No baseline";
  return new Date(dateString).toLocaleString("en-GB", {
    day: "numeric",
    month: "short",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function statusLabel(status) {
  return {
    notify: "Act now",
    watch: "Watch",
    ok: "Healthy",
    nodata: "No data",
  }[status] || status;
}

function flagLabel(flag) {
  return {
    "no-upcoming-sessions": "No future schedule",
    "pending-deduction": "Pending deduction",
    "duplicate-source-rows": "Duplicate source rows",
    "low-balance-no-schedule": "Low balance + no schedule",
    "missing-parent": "Missing parent",
    "exhausted-now": "Exhausted now",
  }[flag] || flag;
}

function toneClass(tone) {
  return {
    critical: "tone-critical",
    warning: "tone-warning",
    attention: "tone-warning",
    positive: "tone-positive",
    info: "tone-info",
  }[tone] || "tone-info";
}

function avatarPalette(index) {
  const palettes = [
    { bg: "#e7eef9", fg: "#0d3b73" },
    { bg: "#fff1e7", fg: "#f36a1d" },
    { bg: "#e8f6ef", fg: "#1d7a4f" },
    { bg: "#fff6df", fg: "#d28b15" },
    { bg: "#ede8fa", fg: "#5d43c4" },
  ];
  return palettes[index % palettes.length];
}

function getInitials(name) {
  return String(name || "")
    .split(" ")
    .filter(Boolean)
    .slice(0, 2)
    .map(function(part) { return part[0]; })
    .join("")
    .toUpperCase();
}

function worstStatus(packages) {
  if (packages.some(function(pkg) { return pkg.status === "notify"; })) return "notify";
  if (packages.some(function(pkg) { return pkg.status === "watch"; })) return "watch";
  if (packages.some(function(pkg) { return pkg.status === "ok"; })) return "ok";
  return "nodata";
}

function matchesSmartFilter(row, filterName) {
  if (filterName === "all") return true;
  if (filterName === "act-now") return row.status === "notify" || row.adjustedRemaining <= 0;
  if (filterName === "this-week") {
    return row.daysUntilAlert !== null && row.daysUntilAlert > 0 && row.daysUntilAlert <= 7;
  }
  if (filterName === "next-30") {
    return row.daysUntilAlert !== null && row.daysUntilAlert > 7 && row.daysUntilAlert <= 30;
  }
  if (filterName === "missing-data") {
    return row.dataQualityFlags.indexOf("no-upcoming-sessions") !== -1;
  }
  if (filterName === "recently-worsened") return row.statusChange === "worsened";
  return true;
}

function matchesSearch(row) {
  if (!currentSearch) return true;
  const haystack = [
    row.student,
    row.parent,
    row.packageName,
    row.recommendedAction,
  ].join(" ").toLowerCase();
  return haystack.indexOf(currentSearch) !== -1;
}

function getSortedFilteredQueue() {
  const filtered = DATA.actionQueue.filter(function(row) {
    return matchesSmartFilter(row, currentFilter) && matchesSearch(row);
  });

  const direction = currentSort.dir === "asc" ? 1 : -1;
  const field = currentSort.field;

  return filtered.slice().sort(function(a, b) {
    if (field === "student") return direction * a.student.localeCompare(b.student);
    if (field === "adjustedRemaining") return direction * (a.adjustedRemaining - b.adjustedRemaining);
    if (field === "pendingDeduction") return direction * (a.pendingDeduction - b.pendingDeduction);
    if (field === "daysUntilAlert") return direction * normalizeDayValue(a.daysUntilAlert, b.daysUntilAlert);
    if (field === "daysUntilExhaust") return direction * normalizeDayValue(a.daysUntilExhaust, b.daysUntilExhaust);
    if (field === "nextSessionDate") {
      return direction * normalizeDateValue(a.nextSessionDate, b.nextSessionDate);
    }
    return direction * (a.priorityScore - b.priorityScore);
  });
}

function normalizeDayValue(dayA, dayB) {
  const normalizedA = dayA === null ? Number.POSITIVE_INFINITY : dayA;
  const normalizedB = dayB === null ? Number.POSITIVE_INFINITY : dayB;
  return normalizedA - normalizedB;
}

function normalizeDateValue(dateA, dateB) {
  const normalizedA = dateA ? new Date(dateA).getTime() : Number.POSITIVE_INFINITY;
  const normalizedB = dateB ? new Date(dateB).getTime() : Number.POSITIVE_INFINITY;
  return normalizedA - normalizedB;
}

function getSelectedQueueRow() {
  const queue = getSortedFilteredQueue();
  if (!queue.length) return null;
  const selected = queue.find(function(row) { return row.key === selectedQueueKey; });
  return selected || queue[0];
}

function getStudentByIndex(index) {
  return index === null ? null : DATA.students[index];
}

function getSidebarStudents() {
  const matchingKeys = {};
  getSortedFilteredQueue().forEach(function(row) {
    matchingKeys[row.student] = true;
  });

  return DATA.students.filter(function(student) {
    const searchPass = !currentSearch || [student.student, student.parent].join(" ").toLowerCase().indexOf(currentSearch) !== -1;
    const filterPass = currentFilter === "all" || matchingKeys[student.student];
    return searchPass && filterPass;
  });
}

function getFilterCount(filterName) {
  return DATA.actionQueue.filter(function(row) {
    return matchesSmartFilter(row, filterName);
  }).length;
}

function renderHeaderState() {
  document.getElementById("view-command").classList.toggle("active", currentView === "command");
  document.getElementById("view-analytics").classList.toggle("active", currentView === "analytics");
  document.getElementById("view-student").classList.toggle("active", currentView === "student");
  document.getElementById("freshness-label").textContent = "Last updated " + formatDateTime(DATA.lastUpdatedAt);
  document.getElementById("comparison-label").textContent = DATA.previousUpdatedAt
    ? "Compared with " + formatDateTime(DATA.previousUpdatedAt)
    : "First stored snapshot";
}

function renderRail() {
  const students = getSidebarStudents();
  const selectedStudent = getStudentByIndex(selectedStudentIndex);

  document.getElementById("rail").innerHTML = `
    <section class="panel rail-panel">
      <div class="panel-heading">
        <div>
          <div class="panel-title">Work queue</div>
          <div class="panel-caption">Filter the queue, then drill into the right package or student.</div>
        </div>
      </div>
      <input
        class="search-input"
        type="text"
        placeholder="Search student, parent, or package"
        value="${escapeHtml(currentSearch)}"
        oninput="setSearch(this.value)"
      />
      <div style="height:14px"></div>
      <div class="filter-grid">
        ${renderFilterChip("all", "All queue", getFilterCount("all"))}
        ${renderFilterChip("act-now", "Act now", getFilterCount("act-now"))}
        ${renderFilterChip("this-week", "This week", getFilterCount("this-week"))}
        ${renderFilterChip("next-30", "Next 30 days", getFilterCount("next-30"))}
        ${renderFilterChip("missing-data", "Missing data", getFilterCount("missing-data"))}
        ${renderFilterChip("recently-worsened", "Worsened", getFilterCount("recently-worsened"))}
      </div>
    </section>

    <section class="panel rail-panel">
      <div class="panel-heading">
        <div class="panel-title">Students</div>
        <div class="panel-caption">${students.length} visible</div>
      </div>
      <div class="student-list">
        ${students.length ? students.map(function(student) {
          const index = DATA.students.indexOf(student);
          const worst = worstStatus(student.packages);
          const riskyCount = student.packages.filter(function(pkg) {
            return pkg.status === "notify" || pkg.status === "watch";
          }).length;
          const palette = avatarPalette(index);
          return `
            <div class="student-row ${selectedStudent && selectedStudent.student === student.student ? "active" : ""}" onclick="openStudent(${index})">
              <div class="avatar" style="background:${palette.bg};color:${palette.fg}">${escapeHtml(getInitials(student.student))}</div>
              <div class="student-copy">
                <div class="student-name">${escapeHtml(student.student)}</div>
                <div class="student-sub">${escapeHtml(student.parent || "Missing parent")} - ${student.packages.length} packages</div>
              </div>
              <div class="student-meta">
                <span class="status-pill ${worst}">${statusLabel(worst)}</span>
                <span class="student-sub">${riskyCount} risky</span>
              </div>
            </div>
          `;
        }).join("") : `<div class="empty-state">No students match this filter.</div>`}
      </div>
    </section>

    <section class="panel rail-panel">
      <div class="panel-heading">
        <div class="panel-title">Top package clusters</div>
        <div class="panel-caption">Where risk is concentrated now</div>
      </div>
      <div class="segment-list">
        ${DATA.segments.packageNames.slice(0, 4).map(function(segment) {
          return `
            <div class="segment-row">
              <div class="segment-copy">
                <div class="segment-name">${escapeHtml(segment.name)}</div>
                <div class="segment-detail">${segment.riskyPackages} risky of ${segment.totalPackages} packages</div>
              </div>
              <div class="segment-value">${segment.notifyPackages}</div>
            </div>
          `;
        }).join("")}
      </div>
    </section>
  `;
}

function renderFilterChip(filterName, label, count) {
  return `
    <button class="filter-chip ${currentFilter === filterName ? "active" : ""}" onclick="setFilter('${filterName}')">
      <div class="chip-label">${label}</div>
      <div class="chip-count">${count}</div>
    </button>
  `;
}

function renderContent() {
  if (currentView === "analytics") {
    document.getElementById("main-area").innerHTML = renderAnalyticsView();
    return;
  }

  if (currentView === "student" && selectedStudentIndex !== null) {
    document.getElementById("main-area").innerHTML = renderStudentDetailView();
    return;
  }

  document.getElementById("main-area").innerHTML = renderCommandCenterView();
}

function renderCommandCenterView() {
  const queue = getSortedFilteredQueue();
  const selectedRow = getSelectedQueueRow();
  if (selectedRow) selectedQueueKey = selectedRow.key;

  return `
    <div class="metrics-grid">
      ${renderMetricCard("Need outreach today", DATA.summary.packages.notify, DATA.summary.deltas.packagesNotify, "Packages already below threshold")}
      ${renderMetricCard("At risk in 7 days", DATA.summary.portfolio.risk7, DATA.summary.deltas.risk7, "Projected to cross threshold within the week")}
      ${renderMetricCard("At risk in 30 days", DATA.summary.portfolio.risk30, DATA.summary.deltas.risk30, "All projected near-term alerts")}
      ${renderMetricCard("No schedule data", DATA.summary.portfolio.noSchedule, DATA.summary.deltas.noSchedule, "Packages with weak forecasting confidence")}
      ${renderMetricCard("Pending deductions", DATA.summary.portfolio.pendingDeductionBacklog, DATA.summary.deltas.pendingDeductionBacklog, "Credits not yet reflected in source balance", " credits")}
    </div>

    <div class="command-grid">
      <div class="queue-panel">
        <section class="panel queue-card">
          <div class="queue-toolbar">
            <div>
              <div class="queue-title">Prioritized action queue</div>
              <div class="queue-subtitle">Ranked by urgency, depletion timing, pending deductions, and data confidence.</div>
            </div>
            <div class="queue-count">${queue.length} packages in view</div>
          </div>
          ${queue.length ? renderQueueTable(queue, selectedRow) : `<div class="empty-state">No packages match the current filter.</div>`}
        </section>
      </div>

      <div class="context-column">
        ${selectedRow ? renderQueueContext(selectedRow) : `<section class="panel context-card"><div class="empty-state">Select a package to inspect its risk brief.</div></section>`}
        <section class="panel context-card">
          <div class="panel-heading">
            <div class="panel-title">What changed</div>
            <div class="panel-caption">Compared with the previous stored snapshot</div>
          </div>
          <div class="insight-list">
            ${DATA.insights.map(function(insight) {
              return `
                <div class="insight-row">
                  <div class="insight-copy">
                    <div class="insight-name">${escapeHtml(insight.title)}</div>
                    <div class="insight-detail">${escapeHtml(insight.detail)}</div>
                  </div>
                  <div class="insight-value ${toneClass(insight.tone)}">${escapeHtml(String(insight.value))}</div>
                </div>
              `;
            }).join("")}
          </div>
        </section>

        <section class="panel context-card">
          <div class="panel-heading">
            <div class="panel-title">Risk drivers</div>
            <div class="panel-caption">Current drivers of workload and low confidence</div>
          </div>
          <div class="driver-list">
            ${DATA.segments.drivers.map(function(driver) {
              return `
                <div class="driver-row">
                  <div class="segment-copy">
                    <div class="segment-name">${escapeHtml(driver.name)}</div>
                  </div>
                  <div class="segment-value ${toneClass(driver.tone)}">${driver.count}</div>
                </div>
              `;
            }).join("")}
          </div>
        </section>
      </div>
    </div>
  `;
}

function renderMetricCard(label, value, delta, subline, suffix) {
  return `
    <section class="metric-card">
      <div class="metric-label">${label}</div>
      <div class="metric-value">${formatNumber(value)}${suffix || ""}</div>
      <div class="metric-sub">${subline}</div>
      <div class="mini-stack" style="margin-top:10px">
        <span class="delta-pill">${formatSigned(delta, suffix || "")} vs last refresh</span>
      </div>
    </section>
  `;
}

function renderQueueTable(queue, selectedRow) {
  return `
    <div class="queue-table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="toggleSort('priorityScore')">Priority</th>
            <th onclick="toggleSort('student')">Student</th>
            <th class="no-sort">Package</th>
            <th onclick="toggleSort('adjustedRemaining')">Actual</th>
            <th onclick="toggleSort('daysUntilAlert')">Risk window</th>
            <th onclick="toggleSort('pendingDeduction')">Pending</th>
            <th onclick="toggleSort('nextSessionDate')">Next session</th>
            <th class="no-sort">Recommended action</th>
          </tr>
        </thead>
        <tbody>
          ${queue.map(function(row) {
            return `
              <tr class="queue-row ${selectedRow && selectedRow.key === row.key ? "active" : ""}" onclick="selectQueue('${escapeJs(row.key)}')">
                <td>
                  <div class="queue-primary mono">${formatNumber(row.priorityScore)}</div>
                  <div class="queue-secondary">${escapeHtml(row.changeSummary)}</div>
                </td>
                <td>
                  <div class="queue-primary">${escapeHtml(row.student)}</div>
                  <div class="queue-secondary">${escapeHtml(row.parent)}</div>
                </td>
                <td>
                  <div class="queue-primary">${escapeHtml(row.packageName)}</div>
                  <div class="mini-stack" style="margin-top:6px">
                    <span class="status-pill ${row.status}">${statusLabel(row.status)}</span>
                    ${row.dataQualityFlags.slice(0, 1).map(function(flag) {
                      return `<span class="flag-pill">${escapeHtml(flagLabel(flag))}</span>`;
                    }).join("")}
                  </div>
                </td>
                <td>
                  <div class="queue-primary">${formatNumber(row.adjustedRemaining)} cr</div>
                  <div class="queue-secondary">System ${formatNumber(row.currentRemaining)} cr</div>
                </td>
                <td>
                  <div class="queue-primary">${escapeHtml(renderRiskWindowText(row))}</div>
                  <div class="queue-secondary">${escapeHtml(renderExhaustionText(row))}</div>
                </td>
                <td>
                  <div class="queue-primary">${formatNumber(row.pendingDeduction)} cr</div>
                  <div class="queue-secondary">${row.pendingDeduction > 0 ? "Awaiting feedback updates" : "No backlog"}</div>
                </td>
                <td>
                  <div class="queue-primary">${escapeHtml(row.nextSessionDate ? formatShortDate(row.nextSessionDate) : "No future session")}</div>
                  <div class="queue-secondary">${escapeHtml(row.cadenceLabel)} cadence</div>
                </td>
                <td>
                  <div class="queue-primary">${escapeHtml(row.recommendedAction)}</div>
                  <div class="queue-secondary">${escapeHtml(row.whyNow)}</div>
                </td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderQueueContext(row) {
  const student = DATA.students[row.studentIndex];
  const pkg = student.packages[row.packageIndex];
  const confidenceText = row.dataQualityFlags.indexOf("no-upcoming-sessions") !== -1
    ? "Low confidence - no future sessions available"
    : "Based on " + row.upcomingCount + " upcoming sessions";

  return `
    <section class="panel context-card">
      <div class="context-head">
        <div>
          <div class="context-title">${escapeHtml(row.student)}</div>
          <div class="context-subtitle">${escapeHtml(row.packageName)} - ${escapeHtml(row.parent)}</div>
        </div>
        <span class="status-pill ${row.status}">${statusLabel(row.status)}</span>
      </div>

      <div class="context-grid">
        <div class="context-hero">
          <div class="context-stat">
            <div class="context-stat-label">Actual credits</div>
            <div class="context-stat-value">${formatNumber(row.adjustedRemaining)}</div>
          </div>
          <div class="context-stat">
            <div class="context-stat-label">Days to alert</div>
            <div class="context-stat-value">${row.daysUntilAlert === null ? "-" : row.daysUntilAlert}</div>
          </div>
          <div class="context-stat">
            <div class="context-stat-label">Priority score</div>
            <div class="context-stat-value">${formatNumber(row.priorityScore)}</div>
          </div>
        </div>

        <div class="context-block">
          <h4>Why this package is here</h4>
          <div>${escapeHtml(row.whyNow)}</div>
          <div class="mini-stack" style="margin-top:10px">
            <span class="delta-pill">${escapeHtml(confidenceText)}</span>
            <span class="delta-pill">${escapeHtml(row.changeSummary)}</span>
          </div>
        </div>

        <div class="context-block">
          <h4>What changed</h4>
          <div class="insight-detail">${escapeHtml(describeContextChange(row))}</div>
        </div>

        <div class="context-block">
          <h4>What should happen next</h4>
          <div class="queue-primary">${escapeHtml(row.recommendedAction)}</div>
          <div class="insight-detail" style="margin-top:6px">${escapeHtml(renderActionNarrative(row))}</div>
          <div class="mini-stack" style="margin-top:10px">
            ${row.dataQualityFlags.map(function(flag) {
              return `<span class="flag-pill">${escapeHtml(flagLabel(flag))}</span>`;
            }).join("")}
          </div>
        </div>

        <div class="context-block">
          <h4>Quick actions</h4>
          <div class="btn-row">
            <button class="action-btn" onclick="openMsgModalByIndex(${row.studentIndex}, ${row.packageIndex})">Preview LINE message</button>
            <button class="ghost-btn" onclick="openStudent(${row.studentIndex})">Open student detail</button>
          </div>
        </div>
      </div>
    </section>
  `;
}

function describeContextChange(row) {
  if (!row.previousStatus) {
    return "This package is new to the stored comparison set, so the current state becomes the new baseline.";
  }
  if (row.statusChange === "worsened") {
    return "Status worsened from " + statusLabel(row.previousStatus).toLowerCase() + " to " + statusLabel(row.status).toLowerCase() + ".";
  }
  if (row.statusChange === "improved") {
    return "Status improved from " + statusLabel(row.previousStatus).toLowerCase() + " to " + statusLabel(row.status).toLowerCase() + ".";
  }
  if (row.balanceDelta !== null && row.balanceDelta !== 0) {
    return "Actual balance moved by " + formatSigned(row.balanceDelta, " credits") + " since the last stored refresh.";
  }
  return "Status and balance are stable since the previous stored refresh.";
}

function renderActionNarrative(row) {
  if (row.status === "notify") {
    return row.adjustedRemaining <= 0
      ? "This package is already exhausted. Outreach should confirm renewal immediately."
      : "The package is already below the threshold, so outreach should happen now.";
  }
  if (row.status === "watch") {
    return row.daysUntilAlert !== null && row.daysUntilAlert <= 7
      ? "This is still pre-alert, but the crossing happens within the week."
      : "Queue this package for pre-emptive renewal follow-up before it becomes urgent.";
  }
  if (row.dataQualityFlags.indexOf("no-upcoming-sessions") !== -1) {
    return "Forecast confidence is low. Confirm the schedule before escalating.";
  }
  return "Keep this package monitored and revisit if the balance deteriorates.";
}

function renderAnalyticsView() {
  return `
    <div class="analytics-grid">
      <div class="metrics-grid">

function renderTrendChart(points) {
  if (!points.length) return `<div class="empty-state">No stored trend points yet.</div>`;

  const width = 640;
  const height = 220;
  const padding = 28;
  const keys = [
    { key: "notify", color: "#c63d31" },
    { key: "watch", color: "#d28b15" },
    { key: "ok", color: "#1d7a4f" },
    { key: "nodata", color: "#0d3b73" },
  ];
  const maxValue = Math.max(1, ...points.flatMap(function(point) {
    return keys.map(function(item) { return point[item.key] || 0; });
  }));

  const xForIndex = function(index) {
    if (points.length === 1) return width / 2;
    return padding + ((width - (padding * 2)) * index / (points.length - 1));
  };
  const yForValue = function(value) {
    return height - padding - ((height - (padding * 2)) * (value / maxValue));
  };

  const polylines = keys.map(function(item) {
    const pointsString = points.map(function(point, index) {
      return xForIndex(index) + "," + yForValue(point[item.key] || 0);
    }).join(" ");
    return `<polyline fill="none" stroke="${item.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pointsString}"></polyline>`;
  }).join("");

  const labels = points.map(function(point, index) {
    return `<text x="${xForIndex(index)}" y="${height - 6}" font-size="11" text-anchor="middle" fill="#8e95a3">${escapeHtml(point.label)}</text>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="220" role="img" aria-label="Risk trend chart">
      <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#d7d2c8" stroke-width="1"></line>
      <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="#d7d2c8" stroke-width="1"></line>
      ${polylines}
      ${labels}
    </svg>
  `;
}

function renderLegend(color, label) {
  return `<span class="legend-pill"><span class="legend-dot" style="background:${color}"></span>${label}</span>`;
}

function renderSegmentBars(items, valueKey, suffix) {
  if (!items.length) return `<div class="empty-state">No segment data available.</div>`;
  const maxValue = Math.max(1, ...items.map(function(item) { return item[valueKey]; }));

  return `
    <div class="segment-bars">
      ${items.map(function(item) {
        const width = Math.max(6, (item[valueKey] / maxValue) * 100);
        return `
          <div class="segment-row" style="display:block">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
              <div class="segment-copy">
                <div class="segment-name">${escapeHtml(item.name)}</div>
                <div class="segment-detail">${item.totalPackages !== undefined ? item.totalPackages + " packages tracked" : item.students + " students"}</div>
              </div>
              <div class="segment-value">${item[valueKey]} ${suffix}</div>
            </div>
            <div class="segment-bar-track" style="margin-top:12px">
              <div class="segment-bar-fill" style="width:${width}%;background:linear-gradient(90deg, var(--navy), var(--orange))"></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderDriverBreakdown(drivers) {
  return `
    <div class="segment-bars">
      ${drivers.map(function(driver) {
        const maxValue = Math.max(1, ...drivers.map(function(item) { return item.count; }));
        return `
          <div class="segment-row" style="display:block">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
              <div class="segment-name">${escapeHtml(driver.name)}</div>
              <div class="segment-value ${toneClass(driver.tone)}">${driver.count}</div>
            </div>
            <div class="segment-bar-track" style="margin-top:12px">
              <div class="segment-bar-fill" style="width:${Math.max(6, (driver.count / maxValue) * 100)}%;background:${driver.tone === "critical" ? "var(--red)" : driver.tone === "warning" ? "var(--yellow)" : "var(--navy)"}"></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderHistogram(buckets) {
  const maxValue = Math.max(1, ...buckets.map(function(bucket) { return bucket.count; }));
  return `
    <div class="hist-grid">
      ${buckets.map(function(bucket) {
        return `
          <div class="hist-cell">
            <div class="stat-label">${escapeHtml(bucket.label)} credits</div>
            <div class="hist-value">${bucket.count}</div>
            <div class="hist-bar-track" style="margin-top:12px">
              <div class="hist-bar-fill" style="width:${Math.max(8, (bucket.count / maxValue) * 100)}%;background:linear-gradient(90deg, var(--orange), var(--navy))"></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderWeekBars(buckets, color) {
  const maxValue = Math.max(1, ...buckets.map(function(bucket) { return bucket.count; }));
  return `
    <div class="week-grid">
      ${buckets.map(function(bucket) {
        return `
          <div class="week-cell">
            <div class="stat-label">${escapeHtml(bucket.label)}</div>
            <div class="week-value">${bucket.count}</div>
            <div class="week-bar-track" style="margin-top:12px">
              <div class="week-bar-fill" style="width:${Math.max(8, (bucket.count / maxValue) * 100)}%;background:${color}"></div>
            </div>
            <div class="segment-detail" style="margin-top:8px">${escapeHtml(formatShortDate(bucket.start))} - ${escapeHtml(formatShortDate(bucket.end))}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderHeatmap(cells) {
  if (!cells.length) return `<div class="empty-state">No projected exhaustion dates yet.</div>`;
  const maxValue = Math.max(1, ...cells.map(function(cell) { return cell.count; }));
  return `
    <div class="heatmap-grid">
      ${cells.map(function(cell) {
        const intensity = cell.count === 0 ? 0.06 : 0.16 + (cell.count / maxValue) * 0.56;
        return `
          <div class="heatmap-cell" title="${escapeHtml(cell.date)}: ${cell.count} packages" style="background:rgba(198,61,49,${intensity});color:${cell.count > 0 ? "white" : "var(--ink-soft)"}">
            ${new Date(cell.date).getDate()}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderWaterfall(pkg) {
  const safeTotal = Math.max(1, pkg.totalCredits || 1);
  const systemPct = Math.max(0, Math.min(100, (pkg.currentRemaining / safeTotal) * 100));
  const pendingPct = Math.max(0, Math.min(100, (pkg.pendingDeduction / safeTotal) * 100));
  const actualPct = Math.max(0, Math.min(100, (pkg.adjustedRemaining / safeTotal) * 100));

  return `
    <div class="waterfall">
      <div class="waterfall-row">
        <div class="waterfall-label">System balance</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${systemPct}%;background:var(--navy)"></div></div>
        <div class="waterfall-value">${formatNumber(pkg.currentRemaining)}</div>
      </div>
      <div class="waterfall-row">
        <div class="waterfall-label">Pending deduction</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${pendingPct}%;background:var(--yellow)"></div></div>
        <div class="waterfall-value">-${formatNumber(pkg.pendingDeduction)}</div>
      </div>
      <div class="waterfall-row">
        <div class="waterfall-label">Actual remaining</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${actualPct}%;background:${pkg.adjustedRemaining < 2 ? "var(--red)" : pkg.adjustedRemaining < 4 ? "var(--yellow)" : "var(--green)"}"></div></div>
        <div class="waterfall-value">${formatNumber(pkg.adjustedRemaining)}</div>
      </div>
    </div>
  `;
}

function renderProjectionChart(pkg) {
  if (!pkg.projection.length) {
    return `<div class="empty-state" style="padding:16px 0">No upcoming sessions available for projection.</div>`;
  }

  const maxBalance = Math.max(pkg.totalCredits || 1, ...pkg.projection.map(function(item) { return Math.max(0, item.bal); }));

  return `
    <div class="chart-shell">
      <div class="projection-bars">
        ${pkg.projection.slice(0, 8).map(function(item) {
          const height = Math.max(18, (Math.max(0, item.bal) / maxBalance) * 96);
          const color = item.bal <= 0 ? "var(--red)" : item.bal < 2 ? "var(--red)" : item.bal < 4 ? "var(--yellow)" : "var(--green)";
          return `
            <div class="projection-bar-wrap">
              <div class="projection-bar" style="height:${height}px;background:${color}"></div>
              <div class="projection-label">${escapeHtml(formatShortDate(item.date))}</div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function renderUpcomingSessionRows(student) {
  const rows = [];
  student.packages.forEach(function(pkg) {
    (pkg.upcomingSessions || []).forEach(function(session) {
      rows.push({
        packageName: pkg.name,
        date: session.date,
        durationMin: session.durationMin,
        deduct: session.deduct,
      });
    });
  });

  rows.sort(function(a, b) {
    return new Date(a.date) - new Date(b.date);
  });

  if (!rows.length) {
    return `<div class="empty-state">No upcoming sessions are scheduled for this student.</div>`;
  }

  return rows.slice(0, 10).map(function(row) {
    return `
      <div class="upcoming-row">
        <div class="segment-copy">
          <div class="segment-name">${escapeHtml(row.packageName)}</div>
          <div class="segment-detail">${escapeHtml(formatDate(row.date))}</div>
        </div>
        <div class="segment-value">${row.durationMin}m / ${formatNumber(row.deduct)} cr</div>
      </div>
    `;
  }).join("");
}

function renderRiskWindowText(row) {
  if (row.adjustedRemaining <= 0) return "Already exhausted";
  if (row.status === "notify") return "Below 2 credits now";
  if (row.alertDate) return "Below 2 on " + formatShortDate(row.alertDate);
  if (row.dataQualityFlags.indexOf("no-upcoming-sessions") !== -1) return "No future sessions";
  return "No near-term alert";
}

function renderExhaustionText(row) {
  if (!row.exhaustDate) return row.nextSessionDate ? "Next " + formatShortDate(row.nextSessionDate) : "No projected exhaustion";
  return "Exhausts " + formatShortDate(row.exhaustDate);
}

    ? new Date(referenceDate).toLocaleDateString("th-TH", { month: "long", year: "numeric" })

  if (pkg.adjustedRemaining <= 0) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} ใช้เครดิตหมดแล้วค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ให้น้องได้เลยนะคะ เพื่อให้การเรียนต่อเนื่องไม่สะดุดค่ะ";
  } else if (pkg.adjustedRemaining < 2) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกเพียง ${formatNumber(pkg.adjustedRemaining)} credit เท่านั้นค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ล่วงหน้าได้เลยนะคะ ทางทีมงานพร้อมช่วยดูแลให้น้องเรียนต่อเนื่องค่ะ";
  } else {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกประมาณ ${formatNumber(pkg.adjustedRemaining)} credits แล้วค่ะ คาดว่าจะลดลงต่ำกว่าเกณฑ์ในช่วง${monthLabel}`;
    actionLine = "ทีมงานอยากแจ้งล่วงหน้าเพื่อช่วยวางแผนต่อ package ได้ทันก่อนเครดิตใกล้หมดนะคะ";
  }

  return [
    `สวัสดีค่ะคุณ${parentFirst} 😊`,
    "",
    `ทีมงาน BeGifted ขอแจ้งอัปเดต package การเรียนของน้อง${studentFirst} นะคะ`,
    "",
    creditLine,
    "",
    actionLine,
    "",
    "หากต้องการให้ทีมงานช่วยแนะนำ package ที่เหมาะสม สามารถแจ้งกลับมาได้เลยนะคะ ขอบคุณค่ะ 🤍",
  ].join("\n");
}

function openMsgModalByIndex(studentIndex, packageIndex) {
  const student = DATA.students[studentIndex];
  const pkg = student && student.packages ? student.packages[packageIndex] : null;
  if (!student || !pkg) return;
  document.getElementById("modal-msg").textContent = buildParentMessage(student, pkg);
  document.getElementById("modal-copy-btn").textContent = "Copy message";
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

function copyMsg() {
  navigator.clipboard.writeText(document.getElementById("modal-msg").textContent);
  document.getElementById("modal-copy-btn").textContent = "Copied";
}

function escapeJs(value) {
  return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function renderAll() {
  renderHeaderState();
  renderRail();
  renderContent();
}

renderAll();
</script>
