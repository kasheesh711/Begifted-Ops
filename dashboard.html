<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeGifted - Credit Control Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f0e8;
    --surface: rgba(255, 253, 249, 0.94);
    --surface-strong: #fffdf9;
    --surface-muted: #f6f1e8;
    --border: rgba(16, 24, 40, 0.08);
    --border-strong: rgba(16, 24, 40, 0.16);
    --ink: #1d2230;
    --ink-soft: #5d6473;
    --ink-faint: #8e95a3;
    --navy: #0d3b73;
    --navy-soft: #e7eef9;
    --orange: #f36a1d;
    --orange-soft: #fff1e7;
    --red: #c63d31;
    --red-soft: #fbe9e7;
    --yellow: #d28b15;
    --yellow-soft: #fff6df;
    --green: #1d7a4f;
    --green-soft: #e8f6ef;
    --shadow: 0 14px 28px rgba(14, 22, 36, 0.08);
    --shadow-soft: 0 6px 16px rgba(14, 22, 36, 0.05);
    --radius-xl: 24px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(243, 106, 29, 0.1), transparent 22%),
      radial-gradient(circle at top right, rgba(13, 59, 115, 0.1), transparent 30%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.45;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    border: none;
    cursor: pointer;
    background: none;
    color: inherit;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: grid;
    grid-template-columns: auto minmax(320px, 1fr) auto;
    gap: 18px;
    align-items: center;
    padding: 18px 24px;
    background: rgba(244, 240, 232, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--orange), #ff9652);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    letter-spacing: -0.04em;
    box-shadow: 0 12px 24px rgba(243, 106, 29, 0.22);
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .brand-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .view-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    flex-shrink: 0;
  }

  .view-btn {
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 700;
    color: var(--ink-soft);
    transition: 0.16s ease;
  }

  .view-btn.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 8px 18px rgba(13, 59, 115, 0.2);
  }

  .view-btn.hidden {
    display: none;
  }

  .search-shell {
    position: relative;
    min-width: 0;
    flex: 1 1 auto;
  }

  .search-stack {
    min-width: min(560px, 100%);
    flex: 1 1 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .top-search {
    width: 100%;
    padding: 13px 44px 13px 44px;
    border-radius: 16px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.82);
    outline: none;
    box-shadow: var(--shadow-soft);
  }

  .top-search:focus {
    border-color: var(--navy);
    background: white;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    pointer-events: none;
  }

  .search-clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(16, 24, 40, 0.06);
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .search-clear-btn.hidden {
    display: none;
  }

  .search-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-chip-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.76);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
    box-shadow: var(--shadow-soft);
  }

  .filter-chip.active {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }

  .search-result-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .topbar-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }

  .scopebar {
    padding: 0 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .scopebar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .scope-label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .admin-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .admin-btn {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.72);
    color: var(--ink-soft);
    font-weight: 700;
    box-shadow: var(--shadow-soft);
    transition: 0.16s ease;
  }

  .admin-btn.active {
    background: var(--orange);
    border-color: rgba(243, 106, 29, 0.35);
    color: white;
  }

  .admin-btn:hover {
    transform: translateY(-1px);
  }

  .scope-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .summary-pill {
    padding: 10px 14px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    min-width: 112px;
  }

  .summary-pill-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .summary-pill-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-top: 2px;
  }

  .meta-pill {
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--ink-soft);
  }

  .app-shell {
    padding: 22px;
  }

  .state-card,
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
  }

  .state-card {
    padding: 28px;
  }

  .state-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .state-detail {
    color: var(--ink-soft);
  }

  .state-actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
  }

  .command-shell {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .restore-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .restore-btn,
  .ghost-btn,
  .action-btn,
  .icon-btn {
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.8);
    padding: 10px 14px;
    font-weight: 700;
    color: var(--ink);
  }

  .action-btn {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }

  .icon-btn {
    padding: 10px 12px;
  }

  .ghost-btn:disabled,
  .icon-btn:disabled,
  .action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .command-layout {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 156px);
  }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .queue-pane {
    margin-right: 10px;
  }

  .calendar-pane {
    margin-left: 10px;
  }

  .splitter {
    width: 10px;
    flex: 0 0 10px;
    position: relative;
    cursor: col-resize;
  }

  .splitter::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 4px;
    margin: auto;
    border-radius: 999px;
    background: rgba(13, 59, 115, 0.14);
  }

  .pane-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
    color: var(--ink-faint);
  }

  .panel-heading-lg {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .panel-caption {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .mini-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mini-pill,
  .status-pill,
  .flag-pill,
  .delta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
  }

  .mini-pill {
    background: var(--surface-muted);
    color: var(--ink-soft);
  }

  .status-pill.notify {
    background: var(--red-soft);
    color: var(--red);
  }

  .status-pill.watch {
    background: var(--yellow-soft);
    color: var(--yellow);
  }

  .status-pill.ok {
    background: var(--green-soft);
    color: var(--green);
  }

  .status-pill.nodata {
    background: var(--navy-soft);
    color: var(--navy);
  }

  .flag-pill,
  .delta-pill {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }

  .queue-table-wrap {
    overflow: auto;
    padding: 0 10px 14px 10px;
  }

  .queue-bulk-bar {
    margin: 0 22px 16px;
    padding: 14px 16px;
    border-radius: 18px;
    border: 1px solid rgba(13, 59, 115, 0.14);
    background: rgba(13, 59, 115, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .queue-bulk-summary {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }

  .queue-bulk-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .select-cell {
    width: 42px;
  }

  .select-checkbox {
    width: 16px;
    height: 16px;
    accent-color: var(--navy);
    cursor: pointer;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 14px 12px;
    border-bottom: 1px solid rgba(16, 24, 40, 0.06);
    vertical-align: top;
    text-align: left;
  }

  th {
    position: sticky;
    top: 0;
    background: rgba(255, 253, 249, 0.98);
    z-index: 1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  th.sortable {
    cursor: pointer;
  }

  .sort-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .queue-row {
    cursor: pointer;
    transition: background 0.16s ease;
  }

  .queue-row:hover {
    background: rgba(241, 235, 223, 0.48);
  }

  .queue-row.is-selected {
    background: rgba(13, 59, 115, 0.06);
  }

  .queue-primary {
    font-weight: 700;
  }

  .queue-secondary {
    margin-top: 4px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .priority-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 800;
  }

  .priority-chip.pinned {
    background: var(--red-soft);
    color: var(--red);
  }

  .priority-chip.standard {
    background: var(--navy-soft);
    color: var(--navy);
  }

  .action-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 800;
  }

  .action-status-pill.contacted {
    background: rgba(0, 164, 120, 0.14);
    color: #0f7a61;
  }

  .action-status-pill.pending-callback {
    background: rgba(243, 106, 29, 0.14);
    color: var(--orange);
  }

  .action-status-pill.resolved {
    background: rgba(13, 59, 115, 0.1);
    color: var(--navy);
  }

  .action-control-row {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .action-control-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .action-control-summary {
    min-width: 220px;
  }

  .action-control-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .action-control-value {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .toast-root {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 30;
    pointer-events: none;
  }

  .toast {
    min-width: 220px;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: var(--shadow);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    transform: translateY(0);
    opacity: 1;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .toast.success {
    border-color: rgba(0, 164, 120, 0.22);
  }

  .toast.error {
    border-color: rgba(181, 51, 53, 0.22);
  }

  .toast.fade-out {
    opacity: 0;
    transform: translateY(6px);
  }

  .skeleton-block,
  .skeleton-line,
  .skeleton-pill {
    position: relative;
    overflow: hidden;
    background: rgba(16, 24, 40, 0.08);
  }

  .skeleton-block::after,
  .skeleton-line::after,
  .skeleton-pill::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    animation: skeleton-shimmer 1.2s infinite;
  }

  .skeleton-pill {
    height: 58px;
    min-width: 112px;
    border-radius: 16px;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .skeleton-block {
    border-radius: 22px;
    border: 1px solid rgba(16, 24, 40, 0.06);
  }

  .skeleton-line {
    height: 12px;
    border-radius: 999px;
  }

  .loading-shell {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .loading-summary-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .loading-command-layout {
    display: grid;
    grid-template-columns: minmax(320px, 48%) minmax(320px, 1fr);
    gap: 20px;
  }

  .loading-panel {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 440px;
  }

  .loading-table-row {
    display: grid;
    grid-template-columns: 90px 1.3fr 1fr 1fr 1fr 0.9fr 1.1fr;
    gap: 12px;
  }

  .loading-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
  }

  .loading-calendar-cell {
    height: 92px;
    border-radius: 18px;
  }

  @keyframes skeleton-shimmer {
    to {
      transform: translateX(100%);
    }
  }

  .balance-critical { color: var(--red); }
  .balance-warning { color: var(--yellow); }
  .balance-positive { color: var(--green); }

  .calendar-toolbar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 0 22px 18px;
  }

  .toolbar-left,
  .toolbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .toolbar-center {
    display: flex;
    justify-content: center;
  }

  .segmented-control {
    display: inline-flex;
    padding: 6px;
    border-radius: 999px;
    background: var(--surface-muted);
  }

  .segmented-control button {
    padding: 9px 14px;
    border-radius: 999px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .segmented-control button.active {
    background: white;
    color: var(--navy);
    box-shadow: var(--shadow-soft);
  }

  .calendar-period-nav {
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
  }

  .calendar-period-btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .calendar-period-heading {
    min-width: 0;
    text-align: center;
    padding: 0 8px;
  }

  .calendar-period-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  .calendar-period-value {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }

  .calendar-body {
    padding: 0 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 0;
    overflow: auto;
  }

  .calendar-content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.9fr);
    gap: 18px;
    min-height: 0;
  }

  .calendar-content-grid.day-focus {
    grid-template-columns: minmax(0, 1fr);
  }

  .calendar-main,
  .calendar-rail {
    min-width: 0;
  }

  .calendar-main {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .calendar-rail {
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.7);
    padding: 12px;
    box-shadow: var(--shadow-soft);
  }

  .calendar-action-strip {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.72);
  }

  .calendar-action-strip-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .calendar-action-strip-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .calendar-action-strip-caption {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .calendar-action-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .calendar-action-pill {
    min-width: 116px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.92);
    text-align: left;
    box-shadow: var(--shadow-soft);
    transition: transform 0.16s ease, border-color 0.16s ease;
  }

  .calendar-action-pill:hover {
    transform: translateY(-1px);
  }

  .calendar-action-pill.selected {
    border-color: rgba(13, 59, 115, 0.25);

<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">BG</div>

          />

<script>
let DATA = createEmptyDashboardData();
let isLoading = true;
let loadError = null;
let currentView = "command";
let currentAdminView = "all";
let selectedStudentIndex = null;
let currentSearch = "";
let currentRiskFilter = "all";
let currentSort = { field: "priorityScore", dir: "desc" };
let queuePanelWidth = 48;
let isQueueHidden = false;
let isCalendarHidden = false;
let isResizing = false;
let calendarView = "month";
let calendarCursor = startOfMonth(new Date());
let selectedCalendarDate = null;
let activeLoadToken = 0;
let loadInFlight = false;
let selectedQueueStudentKeys = {};

const CLIENT_STATUS_ORDER = { notify: 0, watch: 1, ok: 2, nodata: 3 };
const ACTION_STATUS_META = {
  contacted: { label: "Contacted", tone: "contacted" },
  "pending-callback": { label: "Pending Callback", tone: "pending-callback" },
  resolved: { label: "Resolved", tone: "resolved" },
};
const RISK_FILTER_OPTIONS = [
  { key: "all", label: "All" },
  { key: "notify", label: "Notify" },
  { key: "watch", label: "Watch" },
  { key: "ok", label: "Healthy" },
];
const DASHBOARD_TRANSFER_BATCH_SIZE = 5;
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WEEKDAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function createEmptyDashboardData() {
  return {
    adminViews: getDefaultAdminViews(),
    lastUpdatedAt: null,
    previousUpdatedAt: null,
    summary: {
      students: { total: 0, notify: 0, watch: 0, ok: 0, nodata: 0 },
      packages: { total: 0, notify: 0, watch: 0, ok: 0, nodata: 0 },
      portfolio: {
        exhaustedNow: 0,
        risk7: 0,
        risk14: 0,
        risk30: 0,
        noSchedule: 0,
        pendingDeductionBacklog: 0,
        pendingDeductionPackages: 0,
        lowBalanceNoSchedule: 0,
        multiRiskStudents: 0,
      },
      queue: { students: 0, pinnedStudents: 0 },
      deltas: {},
    },
    studentQueue: [],
    calendar: {
      availableStart: null,
      availableEnd: null,
      days: [],
    },
    students: [],
  };
}

function getDefaultAdminViews() {
  return [
    { key: "all", label: "All" },
    { key: "palm", label: "Palm" },
    { key: "kem", label: "Kem" },
    { key: "care", label: "Care" },
    { key: "aya", label: "Aya" },
    { key: "petchy", label: "Petchy" },
    { key: "muk", label: "Muk" },
    { key: "unassigned", label: "Unassigned" },
  ];
}

function hasLoadedData() {
  return !isLoading && !loadError;
}

function getAdminViews() {
  return Array.isArray(DATA.adminViews) && DATA.adminViews.length
    ? DATA.adminViews
    : getDefaultAdminViews();
}

function getAdminViewLabel(viewKey) {
  const match = getAdminViews().find(function(view) {
    return view.key === viewKey;
  });

  return match ? match.label : "All";
}

function matchesCurrentAdminView(adminOwnerKey) {
  if (currentAdminView === "all") return true;
  return String(adminOwnerKey || "unassigned") === currentAdminView;
}

function isStudentVisibleForCurrentAdmin(student) {
  if (!student) return false;
  return matchesCurrentAdminView(student.adminOwnerKey);
}

function getAdminScopedStudents() {
  return DATA.students.filter(function(student) {
    return isStudentVisibleForCurrentAdmin(student);
  });
}

function getAdminScopedQueueRows() {
  return DATA.studentQueue.filter(function(row) {
    return matchesCurrentAdminView(row.adminOwnerKey);
  });
}

function matchesCurrentRiskFilter(row) {
  if (currentRiskFilter === "all") return true;
  return row && row.worstStatus === currentRiskFilter;
}

function getFilteredQueueRows() {
  return getAdminScopedQueueRows().filter(function(row) {
    return matchesCurrentRiskFilter(row)
      && (!currentSearch || row.searchText.indexOf(currentSearch) !== -1);
  });
}

function getVisibleSelectedQueueRows(queue) {
  return (queue || getSortedFilteredQueue()).filter(function(row) {
    return !!selectedQueueStudentKeys[row.studentKey];
  });
}

function getVisibleSelectedQueueCount(queue) {
  return getVisibleSelectedQueueRows(queue).length;
}

function pruneQueueSelection() {
  const visibleKeys = {};

  getSortedFilteredQueue().forEach(function(row) {
    visibleKeys[row.studentKey] = true;
  });

  selectedQueueStudentKeys = Object.keys(selectedQueueStudentKeys).reduce(function(next, studentKey) {
    if (visibleKeys[studentKey]) {
      next[studentKey] = true;
    }
    return next;
  }, {});
}

function getAdminScopedCalendarDays() {
  return DATA.calendar.days.map(function(day) {
    const students = day.students.filter(function(student) {
      return matchesCurrentAdminView(student.adminOwnerKey);
    });

    return {
      date: day.date,
      totalStudents: students.length,
      urgentStudents: students.filter(function(student) {
        return student.pinned || student.worstStatus === "notify";
      }).length,
      watchStudents: students.filter(function(student) {
        return student.worstStatus === "watch";
      }).length,
      students: students,
    };
  });
}

function getAdminScopedSummary() {
  const students = getAdminScopedStudents();
  const queueRows = getAdminScopedQueueRows();
  const calendarDays = getAdminScopedCalendarDays();
  const summary = {
    students: { total: students.length, notify: 0, watch: 0, ok: 0, nodata: 0 },
    packages: { total: 0, notify: 0, watch: 0, ok: 0, nodata: 0 },
    queue: {
      students: queueRows.length,
      pinnedStudents: queueRows.filter(function(row) { return row.pinned; }).length,
    },
    scheduledDays: calendarDays.filter(function(day) {
      return day.totalStudents > 0;
    }).length,
  };

  students.forEach(function(student) {
    summary.students[worstStatus(student.packages)]++;

    student.packages.forEach(function(pkg) {
      summary.packages.total++;
      summary.packages[pkg.status]++;
    });
  });

  return summary;
}

function renderAdminSwitch() {
  return getAdminViews().map(function(view) {
    return `
      <button class="admin-btn ${currentAdminView === view.key ? "active" : ""}" onclick="setAdminView('${view.key}')">
        ${escapeHtml(view.label)}
      </button>
    `;
  }).join("");
}

function renderRiskFilterChips() {
  return RISK_FILTER_OPTIONS.map(function(option) {
    return `
      <button class="filter-chip ${currentRiskFilter === option.key ? "active" : ""}" onclick="setRiskFilter('${option.key}')">
        ${escapeHtml(option.label)}
      </button>
    `;
  }).join("");
}

function renderScopeSummary() {
  if (isLoading) {
    return new Array(6).fill('<div class="summary-pill skeleton-pill"></div>').join("");
  }

  if (loadError) {
    return '<div class="summary-pill"><div class="summary-pill-label">Scope</div><div class="summary-pill-value">Unavailable</div></div>';
  }

  const summary = getAdminScopedSummary();
  const selectedLabel = getAdminViewLabel(currentAdminView);
  const cards = [
    { label: "View", value: selectedLabel },
    { label: "Students", value: String(summary.students.total) },
    { label: "Queue", value: String(summary.queue.students) },
    { label: "Notify Packages", value: String(summary.packages.notify) },
    { label: "Pinned", value: String(summary.queue.pinnedStudents) },
    { label: "Scheduled Days", value: String(summary.scheduledDays) },
  ];

  return cards.map(function(card) {
    return `
      <div class="summary-pill">
        <div class="summary-pill-label">${escapeHtml(card.label)}</div>
        <div class="summary-pill-value">${escapeHtml(card.value)}</div>
      </div>
    `;
  }).join("");
}

function renderSearchResultCount() {
  if (isLoading) return "Loading queue";
  if (loadError) return "Queue unavailable";

  const queueCount = getSortedFilteredQueue().length;
  return queueCount + " student" + (queueCount === 1 ? "" : "s");
}

function requestServer(functionName) {
  const args = Array.prototype.slice.call(arguments, 1);

  return new Promise(function(resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);

    runner[functionName].apply(runner, args);
  });
}

function isRecoverableTransferError(error) {
  const message = error && error.message ? error.message : String(error || "");
  return message.indexOf("Dashboard payload chunk") !== -1
    || message.indexOf("Dashboard transfer metadata is incomplete") !== -1
    || message.indexOf("Unexpected end of JSON input") !== -1;
}

async function restartDashboardTransfer(loadToken) {
  if (loadToken !== activeLoadToken) {
    return;
  }

  const refreshedTransfer = await requestServer("beginDashboardDataTransfer");
  return resolveDashboardTransfer(refreshedTransfer, loadToken, false);
}

async function resolveDashboardTransfer(transfer, loadToken, allowRetry) {
  if (!transfer) {
    throw new Error("Dashboard transfer did not return any data.");
  }

  const canRetry = allowRetry !== false;

  if (transfer.mode === "inline") {
    applyLoadedData(transfer.payload, loadToken);
    return;
  }

  if (transfer.mode !== "chunked" || !transfer.parts) {
    throw new Error("Dashboard transfer metadata is incomplete.");
  }

  const chunks = [];

  for (let startIndex = 0; startIndex < transfer.parts; startIndex += DASHBOARD_TRANSFER_BATCH_SIZE) {
    if (loadToken !== activeLoadToken) {
      return;
    }

    let batch;

    try {
      batch = await requestServer(
        "fetchDashboardDataChunkBatch",
        startIndex,
        DASHBOARD_TRANSFER_BATCH_SIZE
      );
    } catch (error) {
      if (canRetry && isRecoverableTransferError(error)) {
        return restartDashboardTransfer(loadToken);
      }
      throw error;
    }

    if (!Array.isArray(batch) || !batch.length) {
      if (canRetry) {
        return restartDashboardTransfer(loadToken);
      }
      throw new Error("Dashboard payload chunk batch is incomplete.");
    }

    Array.prototype.push.apply(chunks, batch);
  }

  if (loadToken !== activeLoadToken) {
    return;
  }

  try {
    applyLoadedData(JSON.parse(chunks.join("")), loadToken);
  } catch (error) {
    if (canRetry && isRecoverableTransferError(error)) {
      return restartDashboardTransfer(loadToken);
    }
    throw error;
  }
}

function applyLoadedData(payload, loadToken) {
  if (typeof loadToken === "number" && loadToken !== activeLoadToken) {
    return;
  }

  DATA = payload || createEmptyDashboardData();
  loadInFlight = false;
  isLoading = false;
  loadError = null;

  if (!getAdminViews().some(function(view) { return view.key === currentAdminView; })) {
    currentAdminView = "all";
  }

  if (selectedStudentIndex !== null && !DATA.students[selectedStudentIndex]) {
    selectedStudentIndex = null;
    currentView = "command";
  }

  if (selectedStudentIndex !== null && !isStudentVisibleForCurrentAdmin(DATA.students[selectedStudentIndex])) {
    selectedStudentIndex = null;
    currentView = "command";
  }

  if (!selectedCalendarDate) {
    selectedCalendarDate = getDefaultCalendarDate();
  }

  if (selectedCalendarDate && !getCalendarDayMap()[selectedCalendarDate]) {
    selectedCalendarDate = getDefaultCalendarDate();
  }

  pruneQueueSelection();
  renderAll();
}

function handleLoadFailure(error, loadToken) {
  if (typeof loadToken === "number" && loadToken !== activeLoadToken) {
    return;
  }

  loadInFlight = false;
  isLoading = false;
  loadError = error && error.message ? error.message : String(error || "Unknown error");
  renderAll();
}

function loadDashboardData() {
  if (loadInFlight) {
    return;
  }

  const loadToken = ++activeLoadToken;
  loadInFlight = true;
  isLoading = true;
  loadError = null;
  renderAll();

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    handleLoadFailure("Apps Script runtime is unavailable in this view.", loadToken);
    return;
  }

  requestServer("beginDashboardDataTransfer")
    .then(function(transfer) {
      return resolveDashboardTransfer(transfer, loadToken);
    })
    .catch(function(error) {
      handleLoadFailure(error, loadToken);
    });
}

function retryLoadData() {
  loadDashboardData();
}

function renderAll() {
  renderHeaderState();
  renderContent();
}

function renderHeaderState() {
  const commandBtn = document.getElementById("view-command");
  const studentBtn = document.getElementById("view-student");
  const searchInput = document.getElementById("global-search");
  const searchClearBtn = document.getElementById("search-clear-btn");
  const riskFilterChips = document.getElementById("risk-filter-chips");
  const searchResultCount = document.getElementById("search-result-count");
  const adminSwitch = document.getElementById("admin-switch");
  const scopeSummary = document.getElementById("scope-summary");

  commandBtn.classList.toggle("active", currentView === "command");
  studentBtn.classList.toggle("active", currentView === "student");
  studentBtn.classList.toggle("hidden", selectedStudentIndex === null);
  adminSwitch.innerHTML = renderAdminSwitch();
  scopeSummary.innerHTML = renderScopeSummary();
  riskFilterChips.innerHTML = renderRiskFilterChips();
  searchResultCount.textContent = renderSearchResultCount();
  searchClearBtn.classList.toggle("hidden", !currentSearch);

  if (document.activeElement !== searchInput && searchInput.value !== currentSearch) {
    searchInput.value = currentSearch;
  }

  if (isLoading) {
    document.getElementById("freshness-label").textContent = "Loading dashboard data";
    document.getElementById("comparison-label").textContent = "Preparing latest command center";
    return;
  }

  if (loadError) {
    document.getElementById("freshness-label").textContent = "Dashboard load failed";
    document.getElementById("comparison-label").textContent = "Retry to fetch the latest data";
    return;
  }

  document.getElementById("freshness-label").textContent = DATA.lastUpdatedAt
    ? "Last updated " + formatDateTime(DATA.lastUpdatedAt)
    : "Last updated unavailable";
  document.getElementById("comparison-label").textContent = DATA.previousUpdatedAt
    ? "Compared with " + formatDateTime(DATA.previousUpdatedAt)
    : "First stored snapshot";
}

function renderContent() {
  const mainArea = document.getElementById("main-area");

  if (isLoading) {
    mainArea.innerHTML = renderLoadingSkeleton();
    return;
  }

  if (loadError) {
    mainArea.innerHTML = renderStateCard(
      "Dashboard data unavailable",
      loadError,
      '<button class="action-btn" onclick="retryLoadData()">Retry</button>'
    );
    return;
  }

  if (currentView === "student" && selectedStudentIndex !== null && !isStudentVisibleForCurrentAdmin(DATA.students[selectedStudentIndex])) {
    selectedStudentIndex = null;
    currentView = "command";
  }

  if (currentView === "student" && selectedStudentIndex !== null) {
    mainArea.innerHTML = renderStudentDetailView();
    return;
  }

  currentView = "command";
  mainArea.innerHTML = renderCommandCenterView();
}

function renderWeekdayHeaders() {
  return `<div class="calendar-weekdays">${WEEKDAY_NAMES.map(function(name) {
    return `<div class="calendar-weekday">${name}</div>`;
  }).join("")}</div>`;
}

function buildMonthCells() {
  const start = startOfWeek(startOfMonth(calendarCursor));
  const cells = [];

  for (let offset = 0; offset < 42; offset++) {
    const date = addDays(start, offset);
    cells.push(renderCalendarCell(date, date.getMonth() !== calendarCursor.getMonth()));
  }

  return cells;
}

function buildWeekCells() {
  const start = startOfWeek(calendarCursor);
  const cells = [];

  for (let offset = 0; offset < 7; offset++) {
    cells.push(renderCalendarCell(addDays(start, offset), false));
  }

  return cells;
}

    "calendar-cell",
    muted ? "muted" : "",
    isSelected ? "selected" : "",
    tone === "urgent" ? "has-urgent" : "",
    tone === "watch" ? "has-watch" : "",
    tone === "scheduled" ? "has-scheduled" : "",

  return `

      <div class="calendar-day-top">
        <div class="calendar-day-number">${dateObj.getDate()}</div>
        <span class="calendar-count-badge">${day ? day.totalStudents : 0} student${day && day.totalStudents === 1 ? "" : "s"}</span>

function renderStudentDetailView() {
  const student = DATA.students[selectedStudentIndex];
  if (!student || !isStudentVisibleForCurrentAdmin(student)) {
    selectedStudentIndex = null;
    currentView = "command";
    return renderCommandCenterView();
  }

  const riskyPackages = student.packages.filter(function(pkg) {
    return pkg.status === "notify" || pkg.status === "watch";
  });
  const totalPending = student.packages.reduce(function(sum, pkg) {
    return sum + pkg.pendingDeduction;
  }, 0);
  const nextAlert = student.packages
    .filter(function(pkg) { return !!pkg.alertDate; })
    .map(function(pkg) { return pkg.alertDate; })
    .sort()[0];

  return `
    <div class="detail-layout">
      <section class="panel detail-header">
        <button class="back-btn" onclick="goCommand()">Back to command center</button>
        <div class="detail-top" style="margin-top:16px">
          <div>
            <div class="detail-name">${escapeHtml(student.student)}</div>
            <div class="detail-sub">${escapeHtml(student.parent || "Missing parent")} · ${student.packages.length} active packages</div>
            <div class="mini-pills" style="margin-top:12px">
              <span class="status-pill ${worstStatus(student.packages)}">${statusLabel(worstStatus(student.packages))}</span>
              <span class="mini-pill">${escapeHtml(student.adminOwnerName || "Unassigned")}</span>
              ${student.dataQualityFlags.map(function(flag) {
                return `<span class="flag-pill">${escapeHtml(flagLabel(flag))}</span>`;
              }).join("")}
            </div>
          </div>
        </div>
        <div class="detail-summary-grid">
          <div class="detail-summary-card">
            <div class="metric-label">Risky packages</div>
            <div class="metric-value">${riskyPackages.length}</div>
          </div>
          <div class="detail-summary-card">
            <div class="metric-label">Pending deductions</div>
            <div class="metric-value">${formatNumber(totalPending)}</div>
          </div>
          <div class="detail-summary-card">
            <div class="metric-label">Next alert date</div>
            <div class="metric-value" style="font-size:22px">${nextAlert ? escapeHtml(formatShortDate(nextAlert)) : "-"}</div>
          </div>
          <div class="detail-summary-card">
            <div class="metric-label">Worst status</div>
            <div class="metric-value" style="font-size:22px">${escapeHtml(statusLabel(worstStatus(student.packages)))}</div>
          </div>
        </div>
        <div class="action-control-row">
          <div class="action-control-summary">
            <div class="action-control-label">Student action state</div>
            <div class="action-control-value">
              ${student.actionState
                ? `
                  <span class="action-status-pill ${student.actionState.status}">${escapeHtml(actionStatusLabel(student.actionState.status))}</span>
                  <span>${escapeHtml(formatActionStateSummary(student.actionState))}</span>
                `
                : "No action recorded today"}
            </div>
          </div>
          <div class="action-control-actions">
            <button class="ghost-btn" onclick="applyStudentAction(decodeURIComponent('${encodeURIComponent(student.studentKey)}'), 'contacted')">Contacted</button>
            <button class="ghost-btn" onclick="applyStudentAction(decodeURIComponent('${encodeURIComponent(student.studentKey)}'), 'pending-callback')">Pending callback</button>
            <button class="ghost-btn" onclick="applyStudentAction(decodeURIComponent('${encodeURIComponent(student.studentKey)}'), 'resolved')">Resolved</button>
            <button class="ghost-btn" onclick="applyStudentAction(decodeURIComponent('${encodeURIComponent(student.studentKey)}'), '')">Clear</button>
          </div>
        </div>
      </section>

      <section class="package-stack">
        ${student.packages.map(function(pkg, packageIndex) {
          return renderPackageDetailCard(student, pkg, selectedStudentIndex, packageIndex);
        }).join("")}
      </section>

      <section class="panel detail-card">
        <div class="pane-header" style="padding:0 0 16px;border-bottom:none">
          <div>
            <div class="panel-title">Upcoming Sessions</div>
            <div class="panel-caption">Cross-package upcoming schedule for this student</div>
          </div>
        </div>
        <div class="upcoming-list">
          ${renderUpcomingSessionRows(student)}
        </div>
      </section>
    </div>
  `;
}

function renderPackageDetailCard(student, pkg, studentIndex, packageIndex) {
  return `
    <section class="panel package-card">
      <div class="package-head">
        <div>
          <div class="package-title">${escapeHtml(pkg.name)}</div>
          <div class="package-subtitle">${escapeHtml(pkg.recommendedAction)} · ${escapeHtml(pkg.whyNow)}</div>
        </div>
        <div class="mini-pills">
          <span class="status-pill ${pkg.status}">${statusLabel(pkg.status)}</span>
          <span class="delta-pill">Priority ${formatNumber(pkg.priorityScore || 0)}</span>
        </div>
      </div>

      <div class="package-grid">
        <div class="detail-card" style="padding:0">
          <div class="panel-title">Where Are We Now?</div>
          <div class="stat-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px">
            <div class="stat-card">
              <div class="stat-label">Actual remaining</div>
              <div class="stat-value">${formatNumber(pkg.adjustedRemaining)} credits</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">System balance</div>
              <div class="stat-value">${formatNumber(pkg.currentRemaining)} credits</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Pending deduction</div>
              <div class="stat-value">${formatNumber(pkg.pendingDeduction)} credits</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total package</div>
              <div class="stat-value">${formatNumber(pkg.totalCredits)} credits</div>
            </div>
          </div>
        </div>

        <div class="detail-card" style="padding:0">
          <div class="panel-title">Balance Waterfall</div>
          <div style="margin-top:14px">${renderWaterfall(pkg)}</div>
        </div>

        <div class="detail-card" style="padding:0">
          <div class="panel-title">Projection</div>
          <div class="stat-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px">
            <div class="stat-card">
              <div class="stat-label">Below 2 credits</div>
              <div class="stat-value" style="font-size:22px">${pkg.alertDate ? escapeHtml(formatShortDate(pkg.alertDate)) : "-"}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Exhausted</div>
              <div class="stat-value" style="font-size:22px">${pkg.exhaustDate ? escapeHtml(formatShortDate(pkg.exhaustDate)) : "-"}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Next session</div>
              <div class="stat-value" style="font-size:22px">${pkg.nextSessionDate ? escapeHtml(formatShortDate(pkg.nextSessionDate)) : "None"}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Cadence</div>
              <div class="stat-value" style="font-size:22px">${escapeHtml(pkg.cadenceLabel)}</div>
            </div>
          </div>
          ${renderProjectionChart(pkg)}
          ${renderProjectionTable(pkg)}
        </div>

        <div class="detail-card" style="padding:0">
          <div class="panel-title">Recommended Action</div>
          <div style="margin-top:14px">
            <div class="queue-primary">${escapeHtml(pkg.recommendedAction)}</div>
            <div class="queue-secondary">${escapeHtml(pkg.whyNow)}</div>
            <div class="mini-pills" style="margin-top:12px">
              ${pkg.dataQualityFlags.map(function(flag) {
                return `<span class="flag-pill">${escapeHtml(flagLabel(flag))}</span>`;
              }).join("")}
              ${!pkg.dataQualityFlags.length ? '<span class="flag-pill">No data-quality warnings</span>' : ""}
            </div>
            <div class="btn-row" style="margin-top:16px">
              <button class="action-btn" onclick="openMsgModalByIndex(${studentIndex}, ${packageIndex})">Preview LINE message</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderWaterfall(pkg) {
  const safeTotal = Math.max(1, pkg.totalCredits || 1);
  const systemPct = Math.max(0, Math.min(100, (pkg.currentRemaining / safeTotal) * 100));
  const pendingPct = Math.max(0, Math.min(100, (pkg.pendingDeduction / safeTotal) * 100));
  const actualPct = Math.max(0, Math.min(100, (pkg.adjustedRemaining / safeTotal) * 100));

  return `
    <div class="waterfall">
      <div class="waterfall-row">
        <div class="queue-secondary">System balance</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${systemPct}%;background:var(--navy)"></div></div>
        <div class="queue-primary">${formatNumber(pkg.currentRemaining)}</div>
      </div>
      <div class="waterfall-row">
        <div class="queue-secondary">Pending deduction</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${pendingPct}%;background:var(--yellow)"></div></div>
        <div class="queue-primary">-${formatNumber(pkg.pendingDeduction)}</div>
      </div>
      <div class="waterfall-row">
        <div class="queue-secondary">Actual remaining</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${actualPct}%;background:${pkg.adjustedRemaining < 2 ? "var(--red)" : pkg.adjustedRemaining < 4 ? "var(--yellow)" : "var(--green)"}"></div></div>
        <div class="queue-primary">${formatNumber(pkg.adjustedRemaining)}</div>
      </div>
    </div>
  `;
}

function renderProjectionChart(pkg) {
  if (!pkg.projection.length) {
    return '<div class="empty-state" style="margin-top:16px">No upcoming sessions available for projection.</div>';
  }

  const maxBalance = Math.max(pkg.totalCredits || 1, ...pkg.projection.map(function(item) { return Math.max(0, item.bal); }));

  return `
    <div class="projection-bars">
      ${pkg.projection.slice(0, 8).map(function(item) {
        const height = Math.max(18, (Math.max(0, item.bal) / maxBalance) * 110);
        const color = item.bal <= 0 ? "var(--red)" : item.bal < 2 ? "var(--red)" : item.bal < 4 ? "var(--yellow)" : "var(--green)";
        return `
          <div class="projection-bar-wrap">
            <div class="projection-bar" style="height:${height}px;background:${color}"></div>
            <div class="projection-label">${escapeHtml(formatShortDate(item.date))}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderProjectionTable(pkg) {
  if (!pkg.projection.length) return "";

  return `
    <div class="projection-table">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Minutes</th>
            <th>Deduction</th>
            <th>Balance after</th>
          </tr>
        </thead>
        <tbody>
          ${pkg.projection.slice(0, 6).map(function(item) {
            return `
              <tr>
                <td class="mono">${escapeHtml(item.date)}</td>
                <td>${item.dur}</td>
                <td>${formatNumber(item.deduct)} cr</td>
                <td>${formatNumber(item.bal)} cr</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderUpcomingSessionRows(student) {
  const rows = [];
  student.packages.forEach(function(pkg) {
    (pkg.upcomingSessions || []).forEach(function(session) {
      rows.push({
        packageName: pkg.name,
        date: session.date,
        durationMin: session.durationMin,
        deduct: session.deduct,
      });
    });
  });

  rows.sort(function(a, b) {
    return parseDateKey(a.date) - parseDateKey(b.date);
  });

  if (!rows.length) {
    return '<div class="empty-state">No upcoming sessions are scheduled for this student.</div>';
  }

  return rows.slice(0, 12).map(function(row) {
    return `
      <div class="upcoming-row">
        <div>
          <div class="queue-primary">${escapeHtml(row.packageName)}</div>
          <div class="queue-secondary">${escapeHtml(formatLongDate(row.date))}</div>
        </div>
        <div class="queue-primary">${row.durationMin}m / ${formatNumber(row.deduct)} cr</div>
      </div>
    `;
  }).join("");
}

function getSortedFilteredQueue() {
  const filtered = getFilteredQueueRows();

  const direction = currentSort.dir === "asc" ? 1 : -1;
  const field = currentSort.field;

  return filtered.slice().sort(function(a, b) {
    if (field === "student") return direction * a.student.localeCompare(b.student);
    if (field === "priorityScore") return direction * (a.priorityScore - b.priorityScore);
    if (field === "totalCurrentRemaining") return direction * (a.totalCurrentRemaining - b.totalCurrentRemaining);
    if (field === "totalAdjustedRemaining") return direction * (a.totalAdjustedRemaining - b.totalAdjustedRemaining);
    if (field === "packageCount") return direction * (a.packageCount - b.packageCount);
    if (field === "nextSessionDate") return direction * compareNullableDates(a.nextSessionDate, b.nextSessionDate);
    return direction * (getStatusOrder(a.worstStatus) - getStatusOrder(b.worstStatus));
  });
}

function getFilteredCalendarDayMap() {
  const dayMap = {};

  getAdminScopedCalendarDays().forEach(function(day) {
    const students = day.students.filter(function(student) {
      return !currentSearch || student.searchText.indexOf(currentSearch) !== -1;
    });

    dayMap[day.date] = {
      date: day.date,
      totalStudents: students.length,
      urgentStudents: students.filter(function(student) {
        return student.pinned || student.worstStatus === "notify";
      }).length,
      watchStudents: students.filter(function(student) {
        return student.worstStatus === "watch";
      }).length,
      students: students,
    };
  });

  return dayMap;
}

function getCalendarDayMap() {
  const dayMap = {};
  getAdminScopedCalendarDays().forEach(function(day) {
    dayMap[day.date] = day;
  });
  return dayMap;
}

function createEmptyCalendarDay(dateKey) {
  return {
    date: dateKey,
    totalStudents: 0,
    urgentStudents: 0,
    watchStudents: 0,
    students: [],
  };
}

function getVisibleCalendarDates(filteredDayMap) {
  return Object.keys(filteredDayMap)
    .filter(function(key) { return filteredDayMap[key].totalStudents > 0; })
    .sort();
}

function getDefaultCalendarDate() {
  const todayKey = formatDateKey(new Date());
  const filteredDayMap = getFilteredCalendarDayMap();
  if (filteredDayMap[todayKey]) return todayKey;

  const visibleDates = getVisibleCalendarDates(filteredDayMap);

  return visibleDates.length ? visibleDates[0] : todayKey;
}

function getEffectiveSelectedCalendarDate(filteredDayMap) {
  if (selectedCalendarDate) {
    return selectedCalendarDate;
  }

  const visibleDates = getVisibleCalendarDates(filteredDayMap);

  if (filteredDayMap[formatDateKey(new Date())]) {
    return formatDateKey(new Date());
  }

  if (visibleDates.length) {
    return visibleDates[0];
  }

  return formatDateKey(new Date());
}

function getSelectedCalendarDay(filteredDayMap) {
  const dateKey = getEffectiveSelectedCalendarDate(filteredDayMap);
  return dateKey ? (filteredDayMap[dateKey] || createEmptyCalendarDay(dateKey)) : null;
}

function getFallbackSelectedDay() {
  const filteredDayMap = getFilteredCalendarDayMap();
  return getSelectedCalendarDay(filteredDayMap);
}

function getCalendarDayTone(day) {
  if (!day || !day.totalStudents) return "empty";
  if (day.urgentStudents) return "urgent";
  if (day.watchStudents) return "watch";
  return "scheduled";
}

function getCalendarSeverityLabel(day) {
  if (!day || !day.totalStudents) return "No sessions";
  if (day.urgentStudents) return day.urgentStudents + " urgent";
  if (day.watchStudents) return day.watchStudents + " watch";
  return "Healthy day";
}

function getActionableStripDays(filteredDayMap) {
  const visibleDates = getVisibleCalendarDates(filteredDayMap);
  if (!visibleDates.length) return [];

  const referenceKey = getEffectiveSelectedCalendarDate(filteredDayMap) || formatDateKey(new Date());
  const startIndex = visibleDates.findIndex(function(key) {
    return compareNullableDates(key, referenceKey) >= 0;
  });
  const sliceStart = startIndex === -1 ? Math.max(0, visibleDates.length - 7) : startIndex;

  return visibleDates.slice(sliceStart, sliceStart + 7).map(function(key) {
    return filteredDayMap[key];
  });
}

function getAdjacentActionableDate(dateKey, direction) {
  const visibleDates = getVisibleCalendarDates(getFilteredCalendarDayMap());
  if (!visibleDates.length) return null;

  const currentIndex = visibleDates.indexOf(dateKey);
  if (currentIndex === -1) {
    return direction > 0 ? visibleDates[0] : visibleDates[visibleDates.length - 1];
  }

  const nextIndex = currentIndex + direction;
  if (nextIndex < 0 || nextIndex >= visibleDates.length) {
    return null;
  }

  return visibleDates[nextIndex];
}

function findNextCalendarDate(dateKeys, referenceKey) {
  if (!dateKeys.length) return null;

  const nextMatch = dateKeys.find(function(key) {
    return compareNullableDates(key, referenceKey) > 0;
  });

  return nextMatch || dateKeys[0];
}

function setSearch(value) {
  currentSearch = String(value || "").trim().toLowerCase();
  pruneQueueSelection();
  renderAll();
}

function clearSearch() {
  setSearch("");
}

function setRiskFilter(filterKey) {
  currentRiskFilter = filterKey || "all";
  pruneQueueSelection();
  renderAll();
}

function setAdminView(viewKey) {
  currentAdminView = viewKey || "all";
  pruneQueueSelection();

  if (selectedStudentIndex !== null && !isStudentVisibleForCurrentAdmin(DATA.students[selectedStudentIndex])) {
    selectedStudentIndex = null;
    currentView = "command";
  }

  renderAll();
}

function toggleSort(field) {
  if (!hasLoadedData()) return;
  if (currentSort.field === field) {
    currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
  } else {
    currentSort = {
      field: field,
      dir: field === "student" || field === "nextSessionDate" ? "asc" : "desc",
    };
  }
  renderContent();
}

function setView(viewName) {
  if (viewName === "student" && selectedStudentIndex === null) {
    currentView = "command";
  } else {
    currentView = viewName;
  }
  renderAll();
}

function openStudent(index) {
  if (!isStudentVisibleForCurrentAdmin(DATA.students[index])) {
    return;
  }
  selectedStudentIndex = index;
  currentView = "student";
  renderAll();
}

function toggleQueueSelection(event, studentKey) {
  event.stopPropagation();

  if (selectedQueueStudentKeys[studentKey]) {
    delete selectedQueueStudentKeys[studentKey];
  } else {
    selectedQueueStudentKeys[studentKey] = true;
  }

  renderContent();
}

function toggleSelectAllVisibleQueue(event) {
  event.stopPropagation();

  const visibleQueue = getSortedFilteredQueue();
  const shouldSelectAll = getVisibleSelectedQueueCount(visibleQueue) !== visibleQueue.length;

  if (shouldSelectAll) {
    visibleQueue.forEach(function(row) {
      selectedQueueStudentKeys[row.studentKey] = true;
    });
  } else {
    visibleQueue.forEach(function(row) {
      delete selectedQueueStudentKeys[row.studentKey];
    });
  }

  renderContent();
}

function applyStudentAction(studentKey, status) {
  const request = status
    ? requestServer("setStudentAction", studentKey, status, currentAdminView)
    : requestServer("clearStudentAction", studentKey, currentAdminView);

  request
    .then(function(result) {
      patchStudentActionState(result.studentKey, result.actionState);
      showToast(buildActionToastMessage(result.actionState, 1), "success");
      renderAll();
    })
    .catch(function(error) {
      showToast(extractErrorMessage(error), "error");
    });
}

function applyBulkStudentAction(status) {
  const visibleRows = getVisibleSelectedQueueRows();
  if (!visibleRows.length) {
    showToast("Select at least one student first.", "error");
    return;
  }

  requestServer(
    "bulkSetStudentAction",
    visibleRows.map(function(row) { return row.studentKey; }),
    status || "",
    currentAdminView
  )
    .then(function(result) {
      patchBulkStudentActionStates(result.updated || []);
      selectedQueueStudentKeys = {};
      showToast(buildActionToastMessage(status ? { status: status } : null, visibleRows.length), "success");
      renderAll();
    })
    .catch(function(error) {
      showToast(extractErrorMessage(error), "error");
    });
}

function goCommand() {
  currentView = "command";
  renderAll();
}

function hideQueuePane() {
  if (isCalendarHidden) return;
  isQueueHidden = true;
  renderContent();
}

function hideCalendarPane() {
  if (isQueueHidden) return;
  isCalendarHidden = true;
  renderContent();
}

function showQueuePane() {
  isQueueHidden = false;
  renderContent();
}

function showCalendarPane() {
  isCalendarHidden = false;
  renderContent();
}

function startResize(event) {
  if (window.innerWidth <= 960) return;
  event.preventDefault();
  isResizing = true;
  document.addEventListener("mousemove", handleResize);
  document.addEventListener("mouseup", stopResize);
}

function handleResize(event) {
  if (!isResizing) return;
  const layout = document.getElementById("command-layout");
  if (!layout) return;

  const rect = layout.getBoundingClientRect();
  const percentage = ((event.clientX - rect.left) / rect.width) * 100;
  queuePanelWidth = Math.max(26, Math.min(74, percentage));
  renderContent();
}

function stopResize() {
  isResizing = false;
  document.removeEventListener("mousemove", handleResize);
  document.removeEventListener("mouseup", stopResize);
}

function setCalendarView(viewName) {
  calendarView = viewName;
  if (!selectedCalendarDate) {
    selectedCalendarDate = getDefaultCalendarDate();
  }
  if (selectedCalendarDate) {
    calendarCursor = getCalendarCursorForView(viewName, parseDateKey(selectedCalendarDate));
  }
  renderContent();
}

function shiftCalendar(direction) {
  if (calendarView === "month") {
    calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + direction, 1);
    selectedCalendarDate = getDefaultDateForCurrentPeriod(calendarCursor, "month");
  } else if (calendarView === "week") {
    calendarCursor = addDays(calendarCursor, direction * 7);
    selectedCalendarDate = getDefaultDateForCurrentPeriod(calendarCursor, "week");
  } else {
    calendarCursor = addDays(calendarCursor, direction);
    selectedCalendarDate = formatDateKey(calendarCursor);
  }
  renderContent();
}

function getCalendarCursorForView(viewName, date) {
  if (viewName === "month") {
    return startOfMonth(date);
  }
  if (viewName === "week") {
    return startOfWeek(date);
  }
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function getDefaultDateForCurrentPeriod(cursorDate, viewName) {
  const filteredDayMap = getFilteredCalendarDayMap();
  const visibleDates = getVisibleCalendarDates(filteredDayMap);
  if (!visibleDates.length) {
    return formatDateKey(cursorDate);
  }

  if (viewName === "month") {
    const monthStart = startOfMonth(cursorDate);
    const monthEnd = new Date(cursorDate.getFullYear(), cursorDate.getMonth() + 1, 0);
    const withinMonth = visibleDates.find(function(key) {
      return compareNullableDates(key, formatDateKey(monthStart)) >= 0
        && compareNullableDates(key, formatDateKey(monthEnd)) <= 0;
    });
    return withinMonth || formatDateKey(monthStart);
  }

  const weekStart = startOfWeek(cursorDate);
  const weekEnd = addDays(weekStart, 6);
  const withinWeek = visibleDates.find(function(key) {
    return compareNullableDates(key, formatDateKey(weekStart)) >= 0
      && compareNullableDates(key, formatDateKey(weekEnd)) <= 0;
  });

  return withinWeek || formatDateKey(weekStart);
}

function setCalendarMonth(monthValue) {
  calendarCursor = new Date(calendarCursor.getFullYear(), Number(monthValue), 1);
  selectedCalendarDate = getDefaultDateForCurrentPeriod(calendarCursor, "month");
  renderContent();
}

function setCalendarYear(yearValue) {
  calendarCursor = new Date(Number(yearValue), calendarCursor.getMonth(), 1);
  selectedCalendarDate = getDefaultDateForCurrentPeriod(calendarCursor, "month");
  renderContent();
}

function selectCalendarDate(dateKey) {
  selectedCalendarDate = dateKey;
  calendarCursor = getCalendarCursorForView(calendarView, parseDateKey(dateKey));
  renderContent();
}

function jumpToToday() {
  selectCalendarDate(formatDateKey(new Date()));
}

function jumpToNextUrgentDay() {
  const filteredDayMap = getFilteredCalendarDayMap();
  const urgentDates = getVisibleCalendarDates(filteredDayMap).filter(function(key) {
    return filteredDayMap[key].urgentStudents > 0;
  });
  const referenceKey = selectedCalendarDate || formatDateKey(new Date());
  const nextUrgent = findNextCalendarDate(urgentDates, referenceKey);
  if (nextUrgent) {
    selectCalendarDate(nextUrgent);
  }
}

function jumpToNextScheduledDay() {
  const visibleDates = getVisibleCalendarDates(getFilteredCalendarDayMap());
  const referenceKey = selectedCalendarDate || formatDateKey(new Date());
  const nextScheduled = findNextCalendarDate(visibleDates, referenceKey);
  if (nextScheduled) {
    selectCalendarDate(nextScheduled);
  }
}

function jumpToAdjacentActionableDay(direction) {
  if (!selectedCalendarDate) return;

  const target = getAdjacentActionableDate(selectedCalendarDate, direction);
  if (target) {
    selectCalendarDate(target);
  }
}

function renderMonthOptions() {
  return MONTH_NAMES.map(function(name, index) {
    return `<option value="${index}" ${calendarCursor.getMonth() === index ? "selected" : ""}>${name}</option>`;
  }).join("");
}

function renderYearOptions() {
  const start = DATA.calendar.availableStart ? parseDateKey(DATA.calendar.availableStart) : new Date();
  const end = DATA.calendar.availableEnd ? parseDateKey(DATA.calendar.availableEnd) : new Date();
  const startYear = Math.min(start.getFullYear(), new Date().getFullYear());
  const endYear = Math.max(end.getFullYear(), new Date().getFullYear());
  const options = [];

  for (let year = startYear - 1; year <= endYear + 1; year++) {
    options.push(`<option value="${year}" ${calendarCursor.getFullYear() === year ? "selected" : ""}>${year}</option>`);
  }

  return options.join("");
}

function formatCurrentCalendarHeading() {
  if (calendarView === "month") {
    return formatMonthYear(calendarCursor);
  }
  if (calendarView === "week") {
    const start = startOfWeek(calendarCursor);
    const end = addDays(start, 6);
    return formatShortDate(formatDateKey(start)) + " - " + formatShortDate(formatDateKey(end));
  }
  return selectedCalendarDate ? formatLongDate(selectedCalendarDate) : formatLongDate(formatDateKey(calendarCursor));
}

function compareNullableDates(valueA, valueB) {
  const normalizedA = valueA ? parseDateKey(valueA).getTime() : Number.POSITIVE_INFINITY;
  const normalizedB = valueB ? parseDateKey(valueB).getTime() : Number.POSITIVE_INFINITY;
  return normalizedA - normalizedB;
}

function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function startOfWeek(date) {
  const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  copy.setDate(copy.getDate() - copy.getDay());
  return copy;
}

function addDays(date, numberOfDays) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + numberOfDays);
}

function parseDateKey(value) {
  const parts = String(value).split("-").map(function(item) { return Number(item); });
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function formatDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

function formatDateTime(value) {
  const date = new Date(value);
  return date.toLocaleString("en-US", {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

function formatShortDate(value) {
  const date = parseDateKey(value);
  return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function formatShortWeekday(value) {
  const date = parseDateKey(value);
  return date.toLocaleDateString("en-US", { weekday: "short" });
}

function formatLongDate(value) {
  const date = parseDateKey(value);
  return date.toLocaleDateString("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric",
  });
}

function formatMonthYear(date) {
  return date.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}

function formatNumber(value) {
  const numeric = Number(value || 0);
  return numeric % 1 === 0 ? String(numeric) : numeric.toFixed(1);
}

function balanceTone(value) {
  if (value <= 0) return "balance-critical";
  if (value < 2) return "balance-critical";
  if (value < 4) return "balance-warning";
  return "balance-positive";
}

function statusLabel(status) {
  return {
    notify: "Notify",
    watch: "Watch",
    ok: "Healthy",
    nodata: "No data",
  }[status] || status;
}

function actionStatusLabel(status) {
  return ACTION_STATUS_META[status] ? ACTION_STATUS_META[status].label : status;
}

function formatActionStateSummary(actionState) {
  if (!actionState) {
    return "No action recorded today";
  }

  const actor = actionState.updatedByAdminLabel
    ? " by " + actionState.updatedByAdminLabel
    : "";

  return actionStatusLabel(actionState.status) + " " + formatActionTimestamp(actionState.updatedAt) + actor;
}

function formatActionTimestamp(value) {
  const parsed = new Date(value);
  return parsed.toLocaleString("en-US", {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

function patchStudentActionState(studentKey, actionState) {
  DATA.students.forEach(function(student) {
    if (student.studentKey === studentKey) {
      student.actionState = actionState || null;
    }
  });

  DATA.studentQueue.forEach(function(row) {
    if (row.studentKey === studentKey) {
      row.actionState = actionState || null;
    }
  });
}

function patchBulkStudentActionStates(updated) {
  (updated || []).forEach(function(item) {
    patchStudentActionState(item.studentKey, item.actionState || null);
  });
}

function buildActionToastMessage(actionState, count) {
  const total = count || 1;

  if (!actionState || !actionState.status) {
    return total === 1
      ? "Cleared today's action state."
      : "Cleared today's action state for " + total + " students.";
  }

  const label = actionStatusLabel(actionState.status);
  return total === 1
    ? "Marked student as " + label.toLowerCase() + "."
    : "Marked " + total + " students as " + label.toLowerCase() + ".";
}

function extractErrorMessage(error) {
  return error && error.message ? error.message : String(error || "Action failed.");
}

function showToast(message, type) {
  const root = document.getElementById("toast-root");
  if (!root) return;

  const toast = document.createElement("div");
  toast.className = "toast " + (type || "success");
  toast.textContent = message;
  root.appendChild(toast);

  window.setTimeout(function() {
    toast.classList.add("fade-out");
  }, 2600);

  window.setTimeout(function() {
    if (toast.parentNode === root) {
      root.removeChild(toast);
    }
  }, 2800);
}

function getStatusOrder(status) {
  return Object.prototype.hasOwnProperty.call(CLIENT_STATUS_ORDER, status)
    ? CLIENT_STATUS_ORDER[status]
    : 99;
}

function worstStatus(packages) {
  if (packages.some(function(pkg) { return pkg.status === "notify"; })) return "notify";
  if (packages.some(function(pkg) { return pkg.status === "watch"; })) return "watch";
  if (packages.some(function(pkg) { return pkg.status === "ok"; })) return "ok";
  return "nodata";
}

function flagLabel(flag) {
  return {
    "no-upcoming-sessions": "No future schedule",
    "pending-deduction": "Pending deduction",
    "duplicate-source-rows": "Duplicate source rows",
    "low-balance-no-schedule": "Low balance + no schedule",
    "missing-parent": "Missing parent",
    "exhausted-now": "Exhausted now",
  }[flag] || flag;
}

function buildParentMessage(student, pkg) {
  const studentFirst = String(student.student || "").split(" ")[0];
  const parentFirst = String(student.parent || "").split(" ")[0] || "ผู้ปกครอง";
  const referenceDate = pkg.exhaustDate || pkg.alertDate;
  const monthLabel = referenceDate
    ? parseDateKey(referenceDate).toLocaleDateString("th-TH", { month: "long", year: "numeric" })
    : "เร็วๆ นี้";

  let creditLine = "";
  let actionLine = "";

  if (pkg.adjustedRemaining <= 0) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} ใช้เครดิตหมดแล้วค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ให้น้องได้เลยนะคะ เพื่อให้การเรียนต่อเนื่องไม่สะดุดค่ะ";
  } else if (pkg.adjustedRemaining < 2) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกเพียง ${formatNumber(pkg.adjustedRemaining)} credit เท่านั้นค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ล่วงหน้าได้เลยนะคะ ทางทีมงานพร้อมช่วยดูแลให้น้องเรียนต่อเนื่องค่ะ";
  } else {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกประมาณ ${formatNumber(pkg.adjustedRemaining)} credits แล้วค่ะ คาดว่าจะลดลงต่ำกว่าเกณฑ์ในช่วง${monthLabel}`;
    actionLine = "ทีมงานอยากแจ้งล่วงหน้าเพื่อช่วยวางแผนต่อ package ได้ทันก่อนเครดิตใกล้หมดนะคะ";
  }

  return [
    `สวัสดีค่ะคุณ${parentFirst} 😊`,
    "",
    `ทีมงาน BeGifted ขอแจ้งอัปเดต package การเรียนของน้อง${studentFirst} นะคะ`,
    "",
    creditLine,
    "",
    actionLine,
    "",
    "หากต้องการให้ทีมงานช่วยแนะนำ package ที่เหมาะสม สามารถแจ้งกลับมาได้เลยนะคะ ขอบคุณค่ะ 🤍",
  ].join("\n");
}

function openMsgModalByIndex(studentIndex, packageIndex) {
  const student = DATA.students[studentIndex];
  const pkg = student && student.packages ? student.packages[packageIndex] : null;
  if (!student || !pkg) return;
  document.getElementById("modal-msg").textContent = buildParentMessage(student, pkg);
  document.getElementById("modal-copy-btn").textContent = "Copy message";
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

function copyMsg() {
  const message = document.getElementById("modal-msg").textContent;

  navigator.clipboard.writeText(message)
    .then(function() {
      showToast("LINE message copied.", "success");
    })
    .catch(function(error) {
      showToast(extractErrorMessage(error), "error");
    });
}

function escapeHtml(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

renderAll();
loadDashboardData();
</script>
