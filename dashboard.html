<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeGifted - Credit Control Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f0e8;
    --surface: rgba(255, 253, 249, 0.94);
    --surface-strong: #fffdf9;
    --surface-muted: #f6f1e8;
    --border: rgba(16, 24, 40, 0.08);
    --border-strong: rgba(16, 24, 40, 0.16);
    --ink: #1d2230;
    --ink-soft: #5d6473;
    --ink-faint: #8e95a3;
    --navy: #0d3b73;
    --navy-soft: #e7eef9;
    --orange: #f36a1d;
    --orange-soft: #fff1e7;
    --red: #c63d31;
    --red-soft: #fbe9e7;
    --yellow: #d28b15;
    --yellow-soft: #fff6df;
    --green: #1d7a4f;
    --green-soft: #e8f6ef;
    --shadow: 0 14px 28px rgba(14, 22, 36, 0.08);
    --shadow-soft: 0 6px 16px rgba(14, 22, 36, 0.05);
    --radius-xl: 24px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(243, 106, 29, 0.1), transparent 22%),
      radial-gradient(circle at top right, rgba(13, 59, 115, 0.1), transparent 30%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.45;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    border: none;
    cursor: pointer;
    background: none;
    color: inherit;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: grid;
    grid-template-columns: auto minmax(320px, 1fr) auto;
    gap: 18px;
    align-items: center;
    padding: 18px 24px;
    background: rgba(244, 240, 232, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--orange), #ff9652);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    letter-spacing: -0.04em;
    box-shadow: 0 12px 24px rgba(243, 106, 29, 0.22);
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .brand-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .view-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    flex-shrink: 0;
  }

  .view-btn {
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 700;
    color: var(--ink-soft);
    transition: 0.16s ease;
  }

  .view-btn.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 8px 18px rgba(13, 59, 115, 0.2);
  }

  .view-btn.hidden {
    display: none;
  }

  .search-shell {
    position: relative;
    min-width: 0;
    flex: 1 1 auto;
  }

  .top-search {
    width: 100%;
    padding: 13px 16px 13px 44px;
    border-radius: 16px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.82);
    outline: none;
    box-shadow: var(--shadow-soft);
  }

  .top-search:focus {
    border-color: var(--navy);
    background: white;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    pointer-events: none;
  }

  .topbar-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }

  .meta-pill {
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--ink-soft);
  }

  .app-shell {
    padding: 22px;
  }

  .state-card,
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
  }

  .state-card {
    padding: 28px;
  }

  .state-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .state-detail {
    color: var(--ink-soft);
  }

  .state-actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
  }

  .command-shell {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .restore-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .restore-btn,
  .ghost-btn,
  .action-btn,
  .icon-btn {
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.8);
    padding: 10px 14px;
    font-weight: 700;
    color: var(--ink);
  }

  .action-btn {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }

  .icon-btn {
    padding: 10px 12px;
  }

  .command-layout {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 156px);
  }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .queue-pane {
    margin-right: 10px;
  }

  .calendar-pane {
    margin-left: 10px;
  }

  .splitter {
    width: 10px;
    flex: 0 0 10px;
    position: relative;
    cursor: col-resize;
  }

  .splitter::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 4px;
    margin: auto;
    border-radius: 999px;
    background: rgba(13, 59, 115, 0.14);
  }

  .pane-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
    color: var(--ink-faint);
  }

  .panel-heading-lg {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .panel-caption {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .mini-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mini-pill,
  .status-pill,
  .flag-pill,
  .delta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
  }

  .mini-pill {
    background: var(--surface-muted);
    color: var(--ink-soft);
  }

  .status-pill.notify {
    background: var(--red-soft);
    color: var(--red);
  }

  .status-pill.watch {
    background: var(--yellow-soft);
    color: var(--yellow);
  }

  .status-pill.ok {
    background: var(--green-soft);
    color: var(--green);
  }

  .status-pill.nodata {
    background: var(--navy-soft);
    color: var(--navy);
  }

  .flag-pill,
  .delta-pill {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }

  .queue-table-wrap {
    overflow: auto;
    padding: 0 10px 14px 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 14px 12px;
    border-bottom: 1px solid rgba(16, 24, 40, 0.06);
    vertical-align: top;
    text-align: left;
  }

  th {
    position: sticky;
    top: 0;
    background: rgba(255, 253, 249, 0.98);
    z-index: 1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  th.sortable {
    cursor: pointer;
  }

  .sort-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .queue-row {
    cursor: pointer;
    transition: background 0.16s ease;
  }

  .queue-row:hover {
    background: rgba(241, 235, 223, 0.48);
  }

  .queue-primary {
    font-weight: 700;
  }

  .queue-secondary {
    margin-top: 4px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .priority-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 800;
  }

  .priority-chip.pinned {
    background: var(--red-soft);
    color: var(--red);
  }

  .priority-chip.standard {
    background: var(--navy-soft);
    color: var(--navy);
  }

  .balance-critical { color: var(--red); }
  .balance-warning { color: var(--yellow); }
  .balance-positive { color: var(--green); }

  .calendar-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 22px 18px;
  }

  .toolbar-left,
  .toolbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .segmented-control {
    display: inline-flex;
    padding: 6px;
    border-radius: 999px;
    background: var(--surface-muted);
  }

  .segmented-control button {
    padding: 9px 14px;
    border-radius: 999px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .segmented-control button.active {
    background: white;
    color: var(--navy);
    box-shadow: var(--shadow-soft);
  }

  .toolbar-select {
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: white;
  }

  .calendar-body {
    padding: 0 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 0;
    overflow: auto;
  }

  .calendar-grid {
    display: grid;
    gap: 10px;
  }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
  }

  .calendar-grid.month {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .calendar-grid.week {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .calendar-weekday {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 0 4px;
  }

  .calendar-cell {
    min-height: 122px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.85);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--shadow-soft);
    text-align: left;
  }

  .calendar-cell.muted {
    opacity: 0.48;
  }

  .calendar-cell.selected {
    border-color: rgba(13, 59, 115, 0.35);
    box-shadow: inset 0 0 0 1px rgba(13, 59, 115, 0.08), var(--shadow-soft);
  }

  .calendar-cell.has-urgent {
    background: linear-gradient(180deg, rgba(251, 233, 231, 0.92), rgba(255, 255, 255, 0.92));
  }

  .calendar-cell.has-watch {
    background: linear-gradient(180deg, rgba(255, 246, 223, 0.92), rgba(255, 255, 255, 0.92));
  }

  .calendar-day-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .calendar-day-number {
    font-size: 18px;
    font-weight: 800;
  }

  .calendar-summary {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .calendar-summary strong {
    color: var(--ink);
  }

  .calendar-empty {
    border: 1px dashed var(--border-strong);
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.66);
  }

  .day-detail {
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.78);
    padding: 18px;
  }

  .day-detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .day-detail-title {
    font-size: 18px;
    font-weight: 800;
  }

  .day-student-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-student-card {
    border-radius: 18px;
    background: white;
    border: 1px solid var(--border);
    padding: 16px;
  }

  .day-student-top,
  .detail-top,
  .package-head,
  .upcoming-row,
  .btn-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .session-chip-row,
  .detail-summary-grid,
  .package-grid,
  .stat-grid {
    display: grid;
    gap: 12px;
  }

  .session-chip-row {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    margin-top: 14px;
  }

  .session-chip {
    border-radius: 16px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    padding: 12px;
  }

  .detail-layout {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .detail-header,
  .detail-card,
  .package-card {
    padding: 22px;
  }

  .detail-name {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .detail-sub {
    margin-top: 6px;
    color: var(--ink-soft);
  }

  .detail-summary-grid {
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    margin-top: 18px;
  }

  .detail-summary-card,
  .stat-card {
    border-radius: 18px;
    background: var(--surface-muted);
    padding: 16px;
    border: 1px solid var(--border);
  }

  .metric-label,
  .stat-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  .metric-value,
  .stat-value {
    margin-top: 8px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .package-stack {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .package-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .package-subtitle {
    margin-top: 6px;
    color: var(--ink-soft);
  }

  .package-grid {
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    margin-top: 18px;
  }

  .waterfall,
  .upcoming-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .waterfall-row {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .waterfall-track,
  .projection-track {
    height: 12px;
    border-radius: 999px;
    background: rgba(13, 59, 115, 0.08);
    overflow: hidden;
  }

  .waterfall-fill {
    height: 100%;
    border-radius: inherit;
  }

  .projection-bars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    gap: 12px;
    align-items: end;
    min-height: 150px;
    margin-top: 16px;
  }

  .projection-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .projection-bar {
    width: 100%;
    max-width: 52px;
    border-radius: 14px 14px 10px 10px;
  }

  .projection-label {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .projection-table {
    margin-top: 18px;
    overflow: auto;
  }

  .mono {
    font-family: "DM Mono", monospace;
  }

  .empty-state {
    border: 1px dashed var(--border-strong);
    border-radius: 18px;
    padding: 18px;
    color: var(--ink-soft);
    text-align: center;
    background: rgba(255, 255, 255, 0.68);
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: white;
    padding: 10px 14px;
    font-weight: 700;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 16, 32, 0.48);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-card {
    width: min(720px, 100%);
    background: white;
    border-radius: 24px;
    box-shadow: 0 28px 60px rgba(8, 16, 32, 0.22);
    overflow: hidden;
  }

  .modal-head,
  .modal-body,
  .modal-foot {
    padding: 20px 22px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-size: 20px;
    font-weight: 800;
  }

  .modal-body pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: "Plus Jakarta Sans", sans-serif;
    color: var(--ink);
    background: var(--surface-muted);
    border-radius: 18px;
    border: 1px solid var(--border);
    padding: 18px;
  }

  .modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 1100px) {
    .topbar {
      grid-template-columns: 1fr;
    }

    .topbar-meta {
      justify-content: flex-start;
    }
  }

  @media (max-width: 960px) {
    .app-shell {
      padding: 16px;
    }

    .command-layout {
      flex-direction: column;
      min-height: auto;
    }

    .queue-pane,
    .calendar-pane {
      margin: 0;
      width: 100% !important;
    }

    .splitter {
      display: none;
    }

    .calendar-grid.month,
    .calendar-grid.week {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">BG</div>
      <div>
        <div class="brand-title">BeGifted Credit Control</div>
        <div class="brand-subtitle">Student action queue and schedule command center</div>
      </div>
    </div>

    <div class="topbar-controls">
      <div class="view-switch">
        <button class="view-btn active" id="view-command" onclick="setView('command')">Command Center</button>
        <button class="view-btn hidden" id="view-student" onclick="setView('student')">Student Detail</button>
      </div>
      <div class="search-shell">
        <span class="search-icon">⌕</span>
        <input
          id="global-search"
          class="top-search"
          type="text"
          placeholder="Search student, parent, or package"
          oninput="setSearch(this.value)"
        />
      </div>
    </div>

    <div class="topbar-meta">
      <div class="meta-pill" id="freshness-label">Loading dashboard data</div>
      <div class="meta-pill" id="comparison-label">Preparing latest command center</div>
    </div>
  </div>

  <div class="app-shell">
    <div id="main-area"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="if (event.target === this) closeModal()">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">LINE Message Preview</div>
        <button class="icon-btn" onclick="closeModal()">Close</button>
      </div>
      <div class="modal-body">
        <pre id="modal-msg"></pre>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" onclick="closeModal()">Close</button>
        <button class="action-btn" id="modal-copy-btn" onclick="copyMsg()">Copy message</button>
      </div>
    </div>
  </div>

<script>
let DATA = createEmptyDashboardData();
let isLoading = true;
let loadError = null;
let currentView = "command";
let selectedStudentIndex = null;
let currentSearch = "";
let currentSort = { field: "priorityScore", dir: "desc" };
let queuePanelWidth = 48;
let isQueueHidden = false;
let isCalendarHidden = false;
let isResizing = false;
let calendarView = "month";
let calendarCursor = startOfMonth(new Date());
let selectedCalendarDate = null;

const CLIENT_STATUS_ORDER = { notify: 0, watch: 1, ok: 2, nodata: 3 };
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WEEKDAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function createEmptyDashboardData() {
  return {
    lastUpdatedAt: null,
    previousUpdatedAt: null,
    summary: {
      students: { total: 0, notify: 0, watch: 0, ok: 0, nodata: 0 },

        pendingDeductionPackages: 0,

    },

      availableEnd: null,

    },

  };
}

function hasLoadedData() {
  return !isLoading && !loadError;
}

function requestServer(functionName) {
  const args = Array.prototype.slice.call(arguments, 1);

  return new Promise(function(resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);

    runner[functionName].apply(runner, args);
  });
}

async function resolveDashboardTransfer(transfer) {
  if (!transfer) {
    throw new Error("Dashboard transfer did not return any data.");
  }

  if (transfer.mode === "inline") {
    applyLoadedData(transfer.payload);
    return;
  }

  if (transfer.mode !== "chunked" || !transfer.parts) {
    throw new Error("Dashboard transfer metadata is incomplete.");
  }

  const chunkRequests = [];
  for (let index = 0; index < transfer.parts; index++) {
    chunkRequests.push(requestServer("fetchDashboardDataChunk", index));
  }

  const chunks = await Promise.all(chunkRequests);
  applyLoadedData(JSON.parse(chunks.join("")));
}

function applyLoadedData(payload) {
  DATA = payload || createEmptyDashboardData();
  isLoading = false;
  loadError = null;

  if (selectedStudentIndex !== null && !DATA.students[selectedStudentIndex]) {
    selectedStudentIndex = null;
    currentView = "command";
  }

  if (!selectedCalendarDate) {
    selectedCalendarDate = getDefaultCalendarDate();
  }

  if (selectedCalendarDate && !getCalendarDayMap()[selectedCalendarDate]) {
    selectedCalendarDate = getDefaultCalendarDate();
  }

  renderAll();
}

function handleLoadFailure(error) {
  isLoading = false;
  loadError = error && error.message ? error.message : String(error || "Unknown error");
  renderAll();
}

function loadDashboardData() {
  isLoading = true;
  loadError = null;
  renderAll();

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    handleLoadFailure("Apps Script runtime is unavailable in this view.");
    return;
  }

  requestServer("beginDashboardDataTransfer")
    .then(resolveDashboardTransfer)
    .catch(handleLoadFailure);
}

function retryLoadData() {
  loadDashboardData();
}

function renderAll() {
  renderHeaderState();
  renderContent();
}

function renderHeaderState() {
  const commandBtn = document.getElementById("view-command");
  const studentBtn = document.getElementById("view-student");
  const searchInput = document.getElementById("global-search");

  commandBtn.classList.toggle("active", currentView === "command");
  studentBtn.classList.toggle("active", currentView === "student");
  studentBtn.classList.toggle("hidden", selectedStudentIndex === null);

  if (document.activeElement !== searchInput && searchInput.value !== currentSearch) {
    searchInput.value = currentSearch;
  }

  if (isLoading) {
    document.getElementById("freshness-label").textContent = "Loading dashboard data";
    document.getElementById("comparison-label").textContent = "Preparing latest command center";
    return;
  }

  if (loadError) {
    document.getElementById("freshness-label").textContent = "Dashboard load failed";
    document.getElementById("comparison-label").textContent = "Retry to fetch the latest data";
    return;
  }

  document.getElementById("freshness-label").textContent = DATA.lastUpdatedAt
    ? "Last updated " + formatDateTime(DATA.lastUpdatedAt)
    : "Last updated unavailable";
  document.getElementById("comparison-label").textContent = DATA.previousUpdatedAt
    ? "Compared with " + formatDateTime(DATA.previousUpdatedAt)
    : "First stored snapshot";
}

function renderContent() {
  const mainArea = document.getElementById("main-area");

  if (isLoading) {
    mainArea.innerHTML = renderStateCard(
      "Loading command center",
      "The page shell is ready. Live spreadsheet data, queue priorities, and calendar summaries are loading now."
    );
    return;
  }

  if (loadError) {
    mainArea.innerHTML = renderStateCard(
      "Dashboard data unavailable",
      loadError,
      '<button class="action-btn" onclick="retryLoadData()">Retry</button>'
    );
    return;
  }

  if (currentView === "student" && selectedStudentIndex !== null) {
    mainArea.innerHTML = renderStudentDetailView();
    return;
  }

  currentView = "command";
  mainArea.innerHTML = renderCommandCenterView();
}

function renderStateCard(title, detail, actionsMarkup) {

}

function renderCommandCenterView() {
  const queue = getSortedFilteredQueue();
  const filteredDayMap = getFilteredCalendarDayMap();

  return `

      <div class="command-layout" id="command-layout">

function renderRestoreBar() {

function renderCalendarBody(selectedDay) {
  if (calendarView === "day") {
    return renderDayView(selectedDay);
  }

    ? buildMonthCells()
    : buildWeekCells();

  return `
    ${renderWeekdayHeaders()}
    <div class="calendar-grid ${calendarView}">
      ${gridItems.join("")}
    </div>
    ${renderSelectedDayDetail(selectedDay)}
  `;
}

function renderDayView(selectedDay) {
  const fallback = selectedDay || getFallbackSelectedDay();
  if (!fallback) {
    return '<div class="calendar-empty">No scheduled sessions are available for the selected day.</div>';
  }

  return renderSelectedDayDetail(fallback, true);
}

  function renderWeekdayHeaders() {
  return `<div class="calendar-weekdays">${WEEKDAY_NAMES.map(function(name) {
    return `<div class="calendar-weekday">${name}</div>`;
  }).join("")}</div>`;
}

function buildMonthCells() {
  const start = startOfWeek(startOfMonth(calendarCursor));
  const cells = [];

  for (let offset = 0; offset < 42; offset++) {
    const date = addDays(start, offset);
    cells.push(renderCalendarCell(date, date.getMonth() !== calendarCursor.getMonth()));
  }

  return cells;
}

function buildWeekCells() {
  const start = startOfWeek(calendarCursor);
  const cells = [];

  for (let offset = 0; offset < 7; offset++) {
    cells.push(renderCalendarCell(addDays(start, offset), false));
  }

  return cells;
}

function renderCalendarCell(dateObj, muted) {
  const dateKey = formatDateKey(dateObj);
  const day = getFilteredCalendarDayMap()[dateKey] || null;
  const isSelected = selectedCalendarDate === dateKey;
  const classes = [
    "calendar-cell",
    muted ? "muted" : "",
    isSelected ? "selected" : "",
    day && day.urgentStudents ? "has-urgent" : "",
    day && !day.urgentStudents && day.watchStudents ? "has-watch" : "",
  ].filter(Boolean).join(" ");

  return `
    <button class="${classes}" onclick="selectCalendarDate('${dateKey}')">
      <div class="calendar-day-top">
        <div class="calendar-day-number">${dateObj.getDate()}</div>
        ${day && day.urgentStudents ? `<span class="status-pill notify">${day.urgentStudents} urgent</span>` : day && day.watchStudents ? `<span class="status-pill watch">${day.watchStudents} watch</span>` : ""}
      </div>
      <div class="calendar-summary">
        <strong>${day ? day.totalStudents : 0} student${day && day.totalStudents === 1 ? "" : "s"}</strong>
        <span>${day ? summarizeCalendarDay(day) : "No scheduled sessions"}</span>
      </div>
    </button>
  `;
}

function summarizeCalendarDay(day) {
  if (!day.totalStudents) return "No scheduled sessions";
  if (day.urgentStudents) return day.urgentStudents + " urgent, " + day.watchStudents + " watch";
  if (day.watchStudents) return day.watchStudents + " watch, " + (day.totalStudents - day.watchStudents) + " healthy";
  return "All scheduled students are currently healthy";
}

function renderWaterfall(pkg) {
  const safeTotal = Math.max(1, pkg.totalCredits || 1);
  const systemPct = Math.max(0, Math.min(100, (pkg.currentRemaining / safeTotal) * 100));
  const pendingPct = Math.max(0, Math.min(100, (pkg.pendingDeduction / safeTotal) * 100));
  const actualPct = Math.max(0, Math.min(100, (pkg.adjustedRemaining / safeTotal) * 100));

  return `
    <div class="waterfall">
      <div class="waterfall-row">
        <div class="queue-secondary">System balance</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${systemPct}%;background:var(--navy)"></div></div>
        <div class="queue-primary">${formatNumber(pkg.currentRemaining)}</div>
      </div>
      <div class="waterfall-row">
        <div class="queue-secondary">Pending deduction</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${pendingPct}%;background:var(--yellow)"></div></div>
        <div class="queue-primary">-${formatNumber(pkg.pendingDeduction)}</div>
      </div>
      <div class="waterfall-row">
        <div class="queue-secondary">Actual remaining</div>
        <div class="waterfall-track"><div class="waterfall-fill" style="width:${actualPct}%;background:${pkg.adjustedRemaining < 2 ? "var(--red)" : pkg.adjustedRemaining < 4 ? "var(--yellow)" : "var(--green)"}"></div></div>
        <div class="queue-primary">${formatNumber(pkg.adjustedRemaining)}</div>
      </div>
    </div>
  `;
}

function renderProjectionChart(pkg) {
  if (!pkg.projection.length) {
    return '<div class="empty-state" style="margin-top:16px">No upcoming sessions available for projection.</div>';
  }

  const maxBalance = Math.max(pkg.totalCredits || 1, ...pkg.projection.map(function(item) { return Math.max(0, item.bal); }));

  return `
    <div class="projection-bars">
      ${pkg.projection.slice(0, 8).map(function(item) {
        const height = Math.max(18, (Math.max(0, item.bal) / maxBalance) * 110);
        const color = item.bal <= 0 ? "var(--red)" : item.bal < 2 ? "var(--red)" : item.bal < 4 ? "var(--yellow)" : "var(--green)";
        return `
          <div class="projection-bar-wrap">
            <div class="projection-bar" style="height:${height}px;background:${color}"></div>
            <div class="projection-label">${escapeHtml(formatShortDate(item.date))}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderProjectionTable(pkg) {
  if (!pkg.projection.length) return "";

  return `
    <div class="projection-table">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Minutes</th>
            <th>Deduction</th>
            <th>Balance after</th>
          </tr>
        </thead>
        <tbody>
          ${pkg.projection.slice(0, 6).map(function(item) {
            return `
              <tr>
                <td class="mono">${escapeHtml(item.date)}</td>
                <td>${item.dur}</td>
                <td>${formatNumber(item.deduct)} cr</td>
                <td>${formatNumber(item.bal)} cr</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderUpcomingSessionRows(student) {
  const rows = [];
  student.packages.forEach(function(pkg) {
    (pkg.upcomingSessions || []).forEach(function(session) {
      rows.push({
        packageName: pkg.name,
        date: session.date,
        durationMin: session.durationMin,
        deduct: session.deduct,
      });
    });
  });

  rows.sort(function(a, b) {
    return parseDateKey(a.date) - parseDateKey(b.date);
  });

  if (!rows.length) {
    return '<div class="empty-state">No upcoming sessions are scheduled for this student.</div>';
  }

  return rows.slice(0, 12).map(function(row) {
    return `
      <div class="upcoming-row">
        <div>
          <div class="queue-primary">${escapeHtml(row.packageName)}</div>
          <div class="queue-secondary">${escapeHtml(formatLongDate(row.date))}</div>
        </div>
        <div class="queue-primary">${row.durationMin}m / ${formatNumber(row.deduct)} cr</div>
      </div>
    `;
  }).join("");
}

function getSortedFilteredQueue() {
  const filtered = DATA.studentQueue.filter(function(row) {
    return !currentSearch || row.searchText.indexOf(currentSearch) !== -1;
  });

  const direction = currentSort.dir === "asc" ? 1 : -1;
  const field = currentSort.field;

  return filtered.slice().sort(function(a, b) {
    if (field === "student") return direction * a.student.localeCompare(b.student);
    if (field === "priorityScore") return direction * (a.priorityScore - b.priorityScore);
    if (field === "totalCurrentRemaining") return direction * (a.totalCurrentRemaining - b.totalCurrentRemaining);
    if (field === "totalAdjustedRemaining") return direction * (a.totalAdjustedRemaining - b.totalAdjustedRemaining);
    if (field === "packageCount") return direction * (a.packageCount - b.packageCount);
    if (field === "nextSessionDate") return direction * compareNullableDates(a.nextSessionDate, b.nextSessionDate);
    return direction * (getStatusOrder(a.worstStatus) - getStatusOrder(b.worstStatus));
  });
}

function getFilteredCalendarDayMap() {
  const dayMap = {};

  DATA.calendar.days.forEach(function(day) {
    const students = day.students.filter(function(student) {
      return !currentSearch || student.searchText.indexOf(currentSearch) !== -1;
    });

    dayMap[day.date] = {
      date: day.date,
      totalStudents: students.length,
      urgentStudents: students.filter(function(student) {
        return student.pinned || student.worstStatus === "notify";
      }).length,
      watchStudents: students.filter(function(student) {
        return student.worstStatus === "watch";
      }).length,
      students: students,
    };
  });

  return dayMap;
}

function getCalendarDayMap() {
  const dayMap = {};
  DATA.calendar.days.forEach(function(day) {
    dayMap[day.date] = day;
  });
  return dayMap;
}

function getDefaultCalendarDate() {
  const todayKey = formatDateKey(new Date());
  const filteredDayMap = getFilteredCalendarDayMap();
  if (filteredDayMap[todayKey]) return todayKey;

  const visibleDates = Object.keys(filteredDayMap)
    .filter(function(key) { return filteredDayMap[key].totalStudents > 0; })
    .sort();

  return visibleDates.length ? visibleDates[0] : todayKey;
}

function getEffectiveSelectedCalendarDate(filteredDayMap) {
  if (selectedCalendarDate && filteredDayMap[selectedCalendarDate]) {
    return selectedCalendarDate;
  }

  const visibleDates = Object.keys(filteredDayMap)
    .filter(function(key) { return filteredDayMap[key].totalStudents > 0; })
    .sort();

  return visibleDates.length ? visibleDates[0] : null;
}

function getFallbackSelectedDay() {
  const filteredDayMap = getFilteredCalendarDayMap();
  const dateKey = getEffectiveSelectedCalendarDate(filteredDayMap);
  return dateKey ? filteredDayMap[dateKey] : null;
}

function setSearch(value) {
  currentSearch = String(value || "").trim().toLowerCase();
  if (selectedCalendarDate && !getFilteredCalendarDayMap()[selectedCalendarDate]) {
    selectedCalendarDate = getDefaultCalendarDate();
  }
  renderContent();
}

function toggleSort(field) {
  if (!hasLoadedData()) return;
  if (currentSort.field === field) {
    currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
  } else {
    currentSort = {
      field: field,
      dir: field === "student" || field === "nextSessionDate" ? "asc" : "desc",
    };
  }
  renderContent();
}

function setView(viewName) {
  if (viewName === "student" && selectedStudentIndex === null) {
    currentView = "command";
  } else {
    currentView = viewName;
  }
  renderAll();
}

function openStudent(index) {
  selectedStudentIndex = index;
  currentView = "student";
  renderAll();
}

function goCommand() {
  currentView = "command";
  renderAll();
}

function hideQueuePane() {
  if (isCalendarHidden) return;
  isQueueHidden = true;
  renderContent();
}

function hideCalendarPane() {
  if (isQueueHidden) return;
  isCalendarHidden = true;
  renderContent();
}

function showQueuePane() {
  isQueueHidden = false;
  renderContent();
}

function showCalendarPane() {
  isCalendarHidden = false;
  renderContent();
}

function startResize(event) {
  if (window.innerWidth <= 960) return;
  event.preventDefault();
  isResizing = true;
  document.addEventListener("mousemove", handleResize);
  document.addEventListener("mouseup", stopResize);
}

function handleResize(event) {
  if (!isResizing) return;
  const layout = document.getElementById("command-layout");
  if (!layout) return;

  const rect = layout.getBoundingClientRect();
  const percentage = ((event.clientX - rect.left) / rect.width) * 100;
  queuePanelWidth = Math.max(26, Math.min(74, percentage));
  renderContent();
}

function stopResize() {
  isResizing = false;
  document.removeEventListener("mousemove", handleResize);
  document.removeEventListener("mouseup", stopResize);
}

function setCalendarView(viewName) {
  calendarView = viewName;
  if (!selectedCalendarDate) {
    selectedCalendarDate = getDefaultCalendarDate();
  }
  if (viewName === "day" && selectedCalendarDate) {
    calendarCursor = parseDateKey(selectedCalendarDate);
  }
  renderContent();
}

function shiftCalendar(direction) {
  if (calendarView === "month") {
    calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + direction, 1);
  } else if (calendarView === "week") {
    calendarCursor = addDays(calendarCursor, direction * 7);
  } else {
    calendarCursor = addDays(calendarCursor, direction);
    selectedCalendarDate = formatDateKey(calendarCursor);
  }
  renderContent();
}

function setCalendarMonth(monthValue) {
  calendarCursor = new Date(calendarCursor.getFullYear(), Number(monthValue), 1);
  renderContent();
}

function setCalendarYear(yearValue) {
  calendarCursor = new Date(Number(yearValue), calendarCursor.getMonth(), 1);
  renderContent();
}

function selectCalendarDate(dateKey) {
  selectedCalendarDate = dateKey;
  if (calendarView === "day") {
    calendarCursor = parseDateKey(dateKey);
  }
  renderContent();
}

function renderMonthOptions() {
  return MONTH_NAMES.map(function(name, index) {
    return `<option value="${index}" ${calendarCursor.getMonth() === index ? "selected" : ""}>${name}</option>`;
  }).join("");
}

function renderYearOptions() {
  const start = DATA.calendar.availableStart ? parseDateKey(DATA.calendar.availableStart) : new Date();
  const end = DATA.calendar.availableEnd ? parseDateKey(DATA.calendar.availableEnd) : new Date();
  const startYear = Math.min(start.getFullYear(), new Date().getFullYear());
  const endYear = Math.max(end.getFullYear(), new Date().getFullYear());
  const options = [];

  for (let year = startYear - 1; year <= endYear + 1; year++) {
    options.push(`<option value="${year}" ${calendarCursor.getFullYear() === year ? "selected" : ""}>${year}</option>`);
  }

  return options.join("");
}

function formatCurrentCalendarHeading() {
  if (calendarView === "month") {
    return formatMonthYear(calendarCursor);
  }
  if (calendarView === "week") {
    const start = startOfWeek(calendarCursor);
    const end = addDays(start, 6);
    return formatShortDate(formatDateKey(start)) + " - " + formatShortDate(formatDateKey(end));
  }
  return selectedCalendarDate ? formatLongDate(selectedCalendarDate) : formatLongDate(formatDateKey(calendarCursor));
}

function compareNullableDates(valueA, valueB) {
  const normalizedA = valueA ? parseDateKey(valueA).getTime() : Number.POSITIVE_INFINITY;
  const normalizedB = valueB ? parseDateKey(valueB).getTime() : Number.POSITIVE_INFINITY;
  return normalizedA - normalizedB;
}

function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function startOfWeek(date) {
  const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  copy.setDate(copy.getDate() - copy.getDay());
  return copy;
}

function addDays(date, numberOfDays) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + numberOfDays);
}

function parseDateKey(value) {
  const parts = String(value).split("-").map(function(item) { return Number(item); });
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function formatDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

function formatDateTime(value) {
  const date = new Date(value);
  return date.toLocaleString("en-US", {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

function formatShortDate(value) {
  const date = parseDateKey(value);
  return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function formatLongDate(value) {
  const date = parseDateKey(value);
  return date.toLocaleDateString("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric",
  });
}

function formatMonthYear(date) {
  return date.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}

function formatNumber(value) {
  const numeric = Number(value || 0);
  return numeric % 1 === 0 ? String(numeric) : numeric.toFixed(1);
}

function balanceTone(value) {
  if (value <= 0) return "balance-critical";
  if (value < 2) return "balance-critical";
  if (value < 4) return "balance-warning";
  return "balance-positive";
}

function statusLabel(status) {
  return {
    notify: "Notify",
    watch: "Watch",
    ok: "Healthy",
    nodata: "No data",
  }[status] || status;
}

function getStatusOrder(status) {
  return Object.prototype.hasOwnProperty.call(CLIENT_STATUS_ORDER, status)
    ? CLIENT_STATUS_ORDER[status]
    : 99;
}

function worstStatus(packages) {
  if (packages.some(function(pkg) { return pkg.status === "notify"; })) return "notify";
  if (packages.some(function(pkg) { return pkg.status === "watch"; })) return "watch";
  if (packages.some(function(pkg) { return pkg.status === "ok"; })) return "ok";
  return "nodata";
}

function flagLabel(flag) {
  return {
    "no-upcoming-sessions": "No future schedule",
    "pending-deduction": "Pending deduction",
    "duplicate-source-rows": "Duplicate source rows",
    "low-balance-no-schedule": "Low balance + no schedule",
    "missing-parent": "Missing parent",
    "exhausted-now": "Exhausted now",
  }[flag] || flag;
}

function buildParentMessage(student, pkg) {
  const studentFirst = String(student.student || "").split(" ")[0];
  const parentFirst = String(student.parent || "").split(" ")[0] || "ผู้ปกครอง";
  const referenceDate = pkg.exhaustDate || pkg.alertDate;
  const monthLabel = referenceDate
    ? parseDateKey(referenceDate).toLocaleDateString("th-TH", { month: "long", year: "numeric" })
    : "เร็วๆ นี้";

  let creditLine = "";
  let actionLine = "";

  if (pkg.adjustedRemaining <= 0) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} ใช้เครดิตหมดแล้วค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ให้น้องได้เลยนะคะ เพื่อให้การเรียนต่อเนื่องไม่สะดุดค่ะ";
  } else if (pkg.adjustedRemaining < 2) {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกเพียง ${formatNumber(pkg.adjustedRemaining)} credit เท่านั้นค่ะ`;
    actionLine = "รบกวนติดต่อกลับเพื่อวางแผนต่อ package ล่วงหน้าได้เลยนะคะ ทางทีมงานพร้อมช่วยดูแลให้น้องเรียนต่อเนื่องค่ะ";
  } else {
    creditLine = `ตอนนี้ package "${pkg.name}" ของน้อง${studentFirst} เหลือเครดิตอีกประมาณ ${formatNumber(pkg.adjustedRemaining)} credits แล้วค่ะ คาดว่าจะลดลงต่ำกว่าเกณฑ์ในช่วง${monthLabel}`;
    actionLine = "ทีมงานอยากแจ้งล่วงหน้าเพื่อช่วยวางแผนต่อ package ได้ทันก่อนเครดิตใกล้หมดนะคะ";
  }

  return [
    `สวัสดีค่ะคุณ${parentFirst} 😊`,
    "",
    `ทีมงาน BeGifted ขอแจ้งอัปเดต package การเรียนของน้อง${studentFirst} นะคะ`,
    "",
    creditLine,
    "",
    actionLine,
    "",
    "หากต้องการให้ทีมงานช่วยแนะนำ package ที่เหมาะสม สามารถแจ้งกลับมาได้เลยนะคะ ขอบคุณค่ะ 🤍",
  ].join("\n");
}

function openMsgModalByIndex(studentIndex, packageIndex) {
  const student = DATA.students[studentIndex];
  const pkg = student && student.packages ? student.packages[packageIndex] : null;
  if (!student || !pkg) return;
  document.getElementById("modal-msg").textContent = buildParentMessage(student, pkg);
  document.getElementById("modal-copy-btn").textContent = "Copy message";
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

function copyMsg() {
  navigator.clipboard.writeText(document.getElementById("modal-msg").textContent);
  document.getElementById("modal-copy-btn").textContent = "Copied";
}

function escapeHtml(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

renderAll();
loadDashboardData();
</script>
</body>
