<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeGifted - Credit Control Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f0e8;--bg-strong:#ece4d8;--surface:#fffdf9;--surface-muted:#f7f2ea;--surface-alt:#f1ebdf;
    --navy:#0d3b73;--navy-deep:#082847;--navy-soft:#e7eef9;
    --orange:#f36a1d;--orange-soft:#fff1e7;
    --red:#c63d31;--red-soft:#fbe9e7;
    --yellow:#d28b15;--yellow-soft:#fff6df;
    --green:#1d7a4f;--green-soft:#e8f6ef;
    --ink:#1d2230;--ink-soft:#5d6473;--ink-faint:#8e95a3;
    --border:rgba(16,24,40,0.08);--border-strong:rgba(16,24,40,0.14);
    --shadow:0 10px 24px rgba(14,22,36,0.06);--shadow-soft:0 2px 10px rgba(14,22,36,0.04);
    --radius-lg:22px;--radius-md:16px;--radius-sm:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans",sans-serif;background:radial-gradient(circle at top left,rgba(243,106,29,0.08),transparent 24%),radial-gradient(circle at top right,rgba(13,59,115,0.08),transparent 28%),var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
  button,input{font:inherit}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 24px;background:rgba(244,240,232,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(16,24,40,0.08)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-badge{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#ff9652);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-0.04em;box-shadow:0 12px 24px rgba(243,106,29,0.22)}
  .brand-title{font-size:17px;font-weight:800;letter-spacing:-0.04em}
  .brand-subtitle{font-size:12px;color:var(--ink-soft)}
  .view-switch{display:inline-flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,0.72);border:1px solid rgba(16,24,40,0.08);box-shadow:var(--shadow-soft)}
  .view-btn{border:none;background:transparent;color:var(--ink-soft);padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;transition:0.16s ease}
  .view-btn.active{background:var(--navy);color:white;box-shadow:0 8px 18px rgba(13,59,115,0.2)}
  .topbar-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .meta-pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.72);border:1px solid rgba(16,24,40,0.08);font-size:12px;color:var(--ink-soft)}
  .workspace{display:grid;grid-template-columns:320px 1fr;gap:22px;padding:22px}
  .rail{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 108px)}
  .panel{background:rgba(255,253,249,0.92);border:1px solid rgba(16,24,40,0.08);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
  .rail-panel{padding:18px}
  .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .panel-title{font-size:12px;text-transform:uppercase;letter-spacing:0.12em;font-weight:800;color:var(--ink-faint)}
  .panel-caption{font-size:12px;color:var(--ink-soft)}
  .search-input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-muted);color:var(--ink);outline:none}
  .search-input:focus{border-color:var(--navy);background:white}
  .filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .filter-chip{border:1px solid rgba(16,24,40,0.08);border-radius:16px;background:white;padding:12px;cursor:pointer;transition:0.16s ease;text-align:left}
  .filter-chip.active{border-color:rgba(13,59,115,0.28);background:var(--navy-soft);box-shadow:inset 0 0 0 1px rgba(13,59,115,0.08)}
  .chip-label{font-size:12px;font-weight:700;color:var(--ink)}
  .chip-count{margin-top:4px;font-size:20px;font-weight:800;letter-spacing:-0.04em}
  .student-list{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto}
  .student-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid transparent;background:rgba(241,235,223,0.36);cursor:pointer;transition:0.16s ease}
  .student-row:hover,.student-row.active{background:white;border-color:rgba(13,59,115,0.16);transform:translateY(-1px)}
  .avatar{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:-0.04em;flex-shrink:0}
  .student-copy{min-width:0;flex:1}
  .student-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .student-sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .student-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .status-pill,.flag-pill,.delta-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .status-pill.notify,.tone-critical{background:var(--red-soft);color:var(--red)}
  .status-pill.watch,.tone-warning{background:var(--yellow-soft);color:var(--yellow)}
  .status-pill.ok,.tone-positive{background:var(--green-soft);color:var(--green)}
  .status-pill.nodata,.tone-info{background:var(--navy-soft);color:var(--navy)}
  .delta-pill{background:rgba(255,255,255,0.72);color:var(--ink-soft)}
  .flag-pill{background:var(--surface-alt);color:var(--ink-soft);padding:5px 10px}
  .mini-stack{display:flex;flex-wrap:wrap;gap:8px}
  .main-area{min-width:0}
  .metrics-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .metric-card{padding:18px;border-radius:var(--radius-lg);background:rgba(255,253,249,0.92);border:1px solid rgba(16,24,40,0.08);box-shadow:var(--shadow)}
  .metric-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;font-weight:800;color:var(--ink-faint)}
  .metric-value{margin-top:10px;font-size:34px;font-weight:800;letter-spacing:-0.05em;line-height:1}
  .metric-sub{margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .command-grid{display:grid;grid-template-columns:minmax(0,1.4fr) 360px;gap:18px}
  .queue-panel,.context-column,.analytics-grid,.detail-layout{display:flex;flex-direction:column;gap:18px}
  .queue-card{padding:18px}
  .queue-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
  .queue-title{font-size:20px;font-weight:800;letter-spacing:-0.04em}
  .queue-subtitle{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .queue-count{padding:9px 12px;border-radius:999px;background:var(--surface-muted);color:var(--ink-soft);font-size:12px;font-weight:700}
  .queue-table-wrap{overflow:auto;border-radius:18px;border:1px solid rgba(16,24,40,0.06);background:white}
  table{width:100%;border-collapse:collapse}
  th{padding:14px 16px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);background:var(--surface-muted);position:sticky;top:0;z-index:2;cursor:pointer}
  th.no-sort{cursor:default}
  td{padding:14px 16px;border-top:1px solid rgba(16,24,40,0.06);vertical-align:top;font-size:13px}
  .queue-row{cursor:pointer;transition:0.14s ease}
  .queue-row:hover,.queue-row.active{background:rgba(231,238,249,0.78)}
  .queue-primary{font-weight:700}
  .queue-secondary{margin-top:4px;font-size:12px;color:var(--ink-soft)}
  .mono{font-family:"DM Mono",monospace}
  .context-card{padding:18px}
  .context-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .context-title{font-size:19px;font-weight:800;letter-spacing:-0.04em}
  .context-subtitle{margin-top:4px;font-size:13px;color:var(--ink-soft)}
  .context-grid{display:grid;gap:14px}
  .context-block{padding:14px;border-radius:16px;background:var(--surface-muted)}
  .context-block h4,.analytics-card h3,.detail-card h3{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;font-weight:800;color:var(--ink-faint);margin-bottom:10px}
  .context-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .context-stat{padding:12px;border-radius:14px;background:white;border:1px solid rgba(16,24,40,0.06)}
  .context-stat-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.08em;font-weight:800}
  .context-stat-value{margin-top:8px;font-size:18px;font-weight:800;letter-spacing:-0.04em}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .action-btn,.ghost-btn{border:none;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer;transition:0.14s ease}
  .action-btn{background:var(--orange);color:white;box-shadow:0 12px 24px rgba(243,106,29,0.18)}
  .ghost-btn{background:white;color:var(--navy);border:1px solid rgba(13,59,115,0.12)}
  .insight-list,.driver-list,.segment-list,.upcoming-list{display:flex;flex-direction:column;gap:10px}
  .insight-row,.driver-row,.segment-row,.upcoming-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:white;border:1px solid rgba(16,24,40,0.06)}
  .insight-copy,.segment-copy{min-width:0;flex:1}
  .insight-name,.segment-name{font-size:13px;font-weight:700}
  .insight-detail,.segment-detail{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .insight-value,.segment-value{font-size:20px;font-weight:800;letter-spacing:-0.04em;text-align:right}
  .analytics-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .analytics-card,.detail-card{padding:20px}
  .chart-shell{padding:14px;border-radius:18px;background:var(--surface-muted);border:1px solid rgba(16,24,40,0.05)}
  .chart-labels{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .legend-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
  .legend-dot{width:10px;height:10px;border-radius:50%}
  .segment-bars{display:flex;flex-direction:column;gap:12px}
  .segment-bar-track,.hist-bar-track,.week-bar-track{height:10px;border-radius:999px;background:var(--surface-alt);overflow:hidden}
  .segment-bar-fill,.hist-bar-fill,.week-bar-fill{height:100%;border-radius:999px}
  .hist-grid,.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
  .hist-cell,.week-cell{padding:12px;border-radius:16px;background:white;border:1px solid rgba(16,24,40,0.06)}
  .hist-value,.week-value{margin-top:10px;font-size:20px;font-weight:800;letter-spacing:-0.04em}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
  .heatmap-cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,0.5)}
  .detail-header{padding:20px}
  .detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .back-btn{border:none;background:var(--navy-soft);color:var(--navy);font-weight:700;padding:10px 14px;border-radius:999px;cursor:pointer}
  .detail-name{font-size:28px;font-weight:800;letter-spacing:-0.05em}
  .detail-sub{margin-top:6px;color:var(--ink-soft);font-size:14px}
  .detail-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
  .detail-summary-card{padding:14px;border-radius:16px;background:var(--surface-muted)}
  .package-stack{display:flex;flex-direction:column;gap:18px}
  .package-card{padding:20px}
  .package-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
  .package-title{font-size:22px;font-weight:800;letter-spacing:-0.04em}
  .package-subtitle{margin-top:4px;font-size:13px;color:var(--ink-soft)}
  .package-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .stat-card{padding:12px;border-radius:14px;background:white;border:1px solid rgba(16,24,40,0.06)}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);font-weight:800}
  .stat-value{margin-top:8px;font-size:18px;font-weight:800;letter-spacing:-0.04em}
  .waterfall{display:flex;flex-direction:column;gap:12px}
  .waterfall-row{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center}
  .waterfall-label{font-size:12px;color:var(--ink-soft);font-weight:700}
  .waterfall-track{height:12px;border-radius:999px;background:var(--surface-alt);overflow:hidden}
  .waterfall-fill{height:100%;border-radius:999px}
  .waterfall-value{text-align:right;font-weight:800;font-size:12px}
  .projection-table{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid rgba(16,24,40,0.06)}
  .projection-table table td,.projection-table table th{padding:10px 12px;font-size:12px}
  .projection-bars{display:flex;gap:8px;align-items:end;min-height:120px}
  .projection-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .projection-bar{width:100%;max-width:34px;border-radius:12px 12px 8px 8px}
  .projection-label{font-size:11px;color:var(--ink-faint)}
  .empty-state{padding:28px;text-align:center;color:var(--ink-soft)}
  .state-card{padding:28px}
  .state-title{font-size:18px;font-weight:800;letter-spacing:-0.04em}
  .state-detail{margin-top:10px;color:var(--ink-soft);line-height:1.6}
  .state-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .modal-overlay{position:fixed;inset:0;background:rgba(8,15,24,0.45);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{width:min(560px,100%);padding:24px;border-radius:24px;background:white;box-shadow:0 20px 40px rgba(8,15,24,0.2)}
  .modal h3{font-size:18px;font-weight:800;letter-spacing:-0.04em;margin-bottom:14px}
  .modal-msg{padding:16px;border-radius:16px;background:var(--surface-muted);border:1px solid rgba(16,24,40,0.06);white-space:pre-wrap;line-height:1.7;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .modal-btn{border:none;padding:11px 16px;border-radius:14px;font-weight:700;cursor:pointer}
  .modal-btn.secondary{background:var(--surface-muted);color:var(--ink-soft)}
  .modal-btn.primary{background:var(--orange);color:white}
  @media(max-width:1380px){.metrics-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.command-grid,.analytics-row,.package-grid{grid-template-columns:1fr}}
  @media(max-width:1120px){.workspace{grid-template-columns:1fr}.rail{min-height:auto}.student-list{max-height:none}}
  @media(max-width:760px){.topbar{flex-direction:column;align-items:stretch}.view-switch{width:100%;justify-content:space-between}.metrics-grid,.detail-summary-grid,.context-hero,.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-grid{grid-template-columns:1fr}.waterfall-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-badge">BG</div>
    <div>
      <div class="brand-title">BeGifted Credit Control</div>
      <div class="brand-subtitle">Action-first package monitoring and analytics</div>
    </div>
  </div>
  <div class="view-switch">
    <button class="view-btn active" id="view-command" onclick="setView('command')">Command Center</button>
    <button class="view-btn" id="view-analytics" onclick="setView('analytics')">Analytics</button>
    <button class="view-btn" id="view-student" onclick="currentView==='student'?setView('student'):null">Student Detail</button>
  </div>
  <div class="topbar-meta">
    <span class="meta-pill" id="freshness-label"></span>
    <span class="meta-pill" id="comparison-label"></span>
  </div>
</div>

<div class="workspace">
  <aside class="rail" id="rail"></aside>
  <main class="main-area" id="main-area"></main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>LINE message preview</h3>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Close</button>
      <button class="modal-btn primary" id="modal-copy-btn" onclick="copyMsg()">Copy message</button>
    </div>
  </div>
</div>

<script>
// ── NAME HELPERS ──────────────────────────────────────────────────────
function getNickname(name) {
  var m = String(name || '').match(/\(([^)]+)\)/);
  return m ? m[1] : String(name || '').split(' ')[0];
}
function getFullName(name) {
  var out = '', inBracket = false, str = String(name || '');
  for (var i = 0; i < str.length; i++) {
    if (str[i] === '(') { inBracket = true; continue; }
    if (str[i] === ')') { inBracket = false; continue; }
    if (!inBracket) out += str[i];
  }
  return out.replace(/\s+/g, ' ').trim();
}

// ── DATA TRANSFORMER ─────────────────────────────────────────────────
function transformToCommandData(students) {
  var today = new Date(); today.setHours(0,0,0,0);
  var actionQueue = [];
  var allPkgs = [];
  students.forEach(function(s){ allPkgs = allPkgs.concat(s.packages); });

  students.forEach(function(s, si) {
    s.packages.forEach(function(pkg, pi) {
      var score = 0;
      if (pkg.status === 'notify') score += 100;
      else if (pkg.status === 'watch') score += 50;
      if (pkg.adjustedRemaining <= 0) score += 50;
      if (pkg.daysUntilAlert !== null) score += Math.max(0, 30 - (pkg.daysUntilAlert || 30));
      if (pkg.pendingDeduction > 0) score += 10;

      var flags = [];
      if (pkg.status === 'nodata') flags.push('no-upcoming-sessions');
      if (pkg.pendingDeduction > 0) flags.push('pending-deduction');
      if (!s.parent) flags.push('missing-parent');
      if (pkg.adjustedRemaining <= 0) flags.push('exhausted-now');

      var action = 'Monitor', why = 'Healthy balance';
      if (pkg.adjustedRemaining <= 0) { action = 'Renew package immediately'; why = 'Package is exhausted'; }
      else if (pkg.status === 'notify') { action = 'Contact parent today'; why = pkg.adjustedRemaining + ' credits — below threshold'; }
      else if (pkg.status === 'watch') { action = 'Pre-emptive outreach'; why = (pkg.daysUntilAlert || '?') + ' days until balance drops below 2'; }

      var cadence = 'Unknown';
      if (pkg.projection.length >= 4) {
        var avg = (new Date(pkg.projection[3].date) - new Date(pkg.projection[0].date)) / (1000*60*60*24) / 3;
        cadence = avg <= 3.5 ? 'High' : avg <= 7 ? 'Weekly' : 'Low';
      }

      if (pkg.status !== 'ok') {
        var exhaust = pkg.exhaustDate ? Math.round((new Date(pkg.exhaustDate)-today)/(1000*60*60*24)) : null;
        actionQueue.push({
          key: si+'-'+pi, student: s.student, parent: s.parent, packageName: pkg.name,
          studentIndex: si, packageIndex: pi, status: pkg.status,
          adjustedRemaining: pkg.adjustedRemaining, currentRemaining: pkg.currentRemaining,
          pendingDeduction: pkg.pendingDeduction, totalCredits: pkg.totalCredits,
          alertDate: pkg.alertDate, exhaustDate: pkg.exhaustDate,
          daysUntilAlert: pkg.daysUntilAlert, daysUntilExhaust: exhaust,
          priorityScore: Math.round(score), recommendedAction: action, whyNow: why,
          changeSummary: 'Current snapshot', dataQualityFlags: flags,
          upcomingCount: pkg.projection.length,
          nextSessionDate: pkg.projection.length ? pkg.projection[0].date : null,
          cadenceLabel: cadence, previousStatus: null, statusChange: 'stable', balanceDelta: null,
        });
      }
    });
  });

  actionQueue.sort(function(a,b){ return b.priorityScore - a.priorityScore; });

  var notifyPkgs = allPkgs.filter(function(p){return p.status==='notify';}).length;
  var watchPkgs  = allPkgs.filter(function(p){return p.status==='watch';}).length;
  var okPkgs     = allPkgs.filter(function(p){return p.status==='ok';}).length;
  var nodataPkgs = allPkgs.filter(function(p){return p.status==='nodata';}).length;
  var exhaustedNow = allPkgs.filter(function(p){return p.adjustedRemaining<=0;}).length;
  var pendingBacklog = Math.round(allPkgs.reduce(function(s,p){return s+p.pendingDeduction;},0)*10)/10;
  var pendingPkgs = allPkgs.filter(function(p){return p.pendingDeduction>0;}).length;
  var risk7  = actionQueue.filter(function(r){return r.daysUntilAlert!==null&&r.daysUntilAlert<=7;}).length;
  var risk30 = actionQueue.filter(function(r){return r.daysUntilAlert!==null&&r.daysUntilAlert<=30;}).length;
  var noSchedule = allPkgs.filter(function(p){return p.status==='nodata';}).length;
  var multiRisk = students.filter(function(s){
    return s.packages.filter(function(p){return p.status==='notify'||p.status==='watch';}).length > 1;
  }).length;
  var notifyStudents = students.filter(function(s){return s.packages.some(function(p){return p.status==='notify';});}).length;
  var watchStudents  = students.filter(function(s){
    return !s.packages.some(function(p){return p.status==='notify';}) && s.packages.some(function(p){return p.status==='watch';});
  }).length;

  var pkgMap = {};
  allPkgs.forEach(function(p){
    if(!pkgMap[p.name]) pkgMap[p.name]={name:p.name,totalPackages:0,riskyPackages:0,notifyPackages:0};
    pkgMap[p.name].totalPackages++;
    if(p.status==='notify'||p.status==='watch') pkgMap[p.name].riskyPackages++;
    if(p.status==='notify') pkgMap[p.name].notifyPackages++;
  });
  var packageNames = Object.values(pkgMap).sort(function(a,b){return b.notifyPackages-a.notifyPackages;});

  var parMap = {};
  students.forEach(function(s){
    var par = s.parent||'Unknown';
    if(!parMap[par]) parMap[par]={name:par,students:0,totalPackages:0,riskyPackages:0};
    parMap[par].students++;
    s.packages.forEach(function(p){
      parMap[par].totalPackages++;
      if(p.status==='notify'||p.status==='watch') parMap[par].riskyPackages++;
    });
  });
  var parents = Object.values(parMap).filter(function(p){return p.riskyPackages>0;})
    .sort(function(a,b){return b.riskyPackages-a.riskyPackages;}).slice(0,6);

  var distribution = [
    {label:'0',   count:allPkgs.filter(function(p){return p.adjustedRemaining<=0;}).length},
    {label:'1-2', count:allPkgs.filter(function(p){return p.adjustedRemaining>0&&p.adjustedRemaining<=2;}).length},
    {label:'3-5', count:allPkgs.filter(function(p){return p.adjustedRemaining>2&&p.adjustedRemaining<=5;}).length},
    {label:'6-10',count:allPkgs.filter(function(p){return p.adjustedRemaining>5&&p.adjustedRemaining<=10;}).length},
    {label:'11+', count:allPkgs.filter(function(p){return p.adjustedRemaining>10;}).length},
  ];

  function weekBuckets(dateField) {
    var out=[];
    for(var w=0;w<8;w++){
      var s0=new Date(today); s0.setDate(s0.getDate()+w*7);
      var e0=new Date(today); e0.setDate(e0.getDate()+(w+1)*7);
      out.push({label:'W'+(w+1),
        count:allPkgs.filter(function(p){if(!p[dateField])return false;var d=new Date(p[dateField]);return d>=s0&&d<e0;}).length,
        start:s0.toISOString().slice(0,10),end:e0.toISOString().slice(0,10)});
    }
    return out;
  }

  var heatmap=[];
  for(var d=0;d<42;d++){
    var dt=new Date(today); dt.setDate(dt.getDate()+d);
    var ds=dt.toISOString().slice(0,10);
    heatmap.push({date:ds,count:allPkgs.filter(function(p){return p.exhaustDate===ds;}).length});
  }

  var enriched=students.map(function(s,si){
    return {
      student:s.student, parent:s.parent,
      packages:s.packages.map(function(pkg,pi){
        var pf=[];
        if(pkg.status==='nodata') pf.push('no-upcoming-sessions');
        if(pkg.pendingDeduction>0) pf.push('pending-deduction');
        if(pkg.adjustedRemaining<=0) pf.push('exhausted-now');
        var a='Monitor',w2='Healthy';
        if(pkg.adjustedRemaining<=0){a='Renew immediately';w2='No credits';}
        else if(pkg.status==='notify'){a='Contact parent';w2=pkg.adjustedRemaining+' cr left';}
        else if(pkg.status==='watch'){a='Plan outreach';w2=(pkg.daysUntilAlert||'?')+' days to threshold';}
        var cad='Unknown';
        if(pkg.projection.length>=4){
          var av=(new Date(pkg.projection[3].date)-new Date(pkg.projection[0].date))/(1000*60*60*24)/3;
          cad=av<=3.5?'High':av<=7?'Weekly':'Low';
        }
        var qr=actionQueue.find(function(r){return r.studentIndex===si&&r.packageIndex===pi;});
        return {
          name:pkg.name,status:pkg.status,
          currentRemaining:pkg.currentRemaining,pendingDeduction:pkg.pendingDeduction,
          adjustedRemaining:pkg.adjustedRemaining,totalCredits:pkg.totalCredits,
          alertDate:pkg.alertDate,exhaustDate:pkg.exhaustDate,daysUntilAlert:pkg.daysUntilAlert,
          projection:pkg.projection,priorityScore:qr?qr.priorityScore:0,
          recommendedAction:a,whyNow:w2,dataQualityFlags:pf,
          nextSessionDate:pkg.projection.length?pkg.projection[0].date:null,
          cadenceLabel:cad,
          upcomingSessions:pkg.projection.map(function(r){return{date:r.date,durationMin:r.dur,deduct:r.deduct};}),
        };
      }),
      dataQualityFlags: (!s.parent ? ['missing-parent'] : []),
    };
  });

  return {
    lastUpdatedAt:new Date().toISOString(), previousUpdatedAt:null,
    summary:{
      students:{total:students.length,notify:notifyStudents,watch:watchStudents,ok:students.length-notifyStudents-watchStudents,nodata:0},
      packages:{total:allPkgs.length,notify:notifyPkgs,watch:watchPkgs,ok:okPkgs,nodata:nodataPkgs},
      portfolio:{exhaustedNow:exhaustedNow,risk7:risk7,risk14:0,risk30:risk30,noSchedule:noSchedule,
        pendingDeductionBacklog:pendingBacklog,pendingDeductionPackages:pendingPkgs,lowBalanceNoSchedule:0,multiRiskStudents:multiRisk},
      deltas:{packagesNotify:null,packagesWatch:null,risk7:null,risk30:null,pendingDeductionBacklog:null,noSchedule:null},
    },
    insights:[
      {title:'Packages needing outreach',detail:'Currently below 2-credit threshold',value:notifyPkgs,tone:'critical'},
      {title:'Watch list packages',detail:'Projected to hit threshold within 30 days',value:watchPkgs,tone:'warning'},
      {title:'Pending deduction backlog',detail:'Credits awaiting teacher feedback',value:pendingBacklog+' cr',tone:'warning'},
      {title:'No schedule data',detail:'Packages with no upcoming sessions',value:noSchedule,tone:'attention'},
    ],
    segments:{
      packageNames:packageNames,parents:parents,cadence:[],
      drivers:[
        {name:'Need immediate outreach',count:notifyPkgs,tone:'critical'},
        {name:'No upcoming sessions',count:noSchedule,tone:'warning'},
        {name:'Pending deductions',count:pendingPkgs,tone:'warning'},
        {name:'Exhausted now',count:exhaustedNow,tone:'critical'},
        {name:'Multi-risk students',count:multiRisk,tone:'warning'},
      ],
      distribution:distribution,
      outreachByWeek:weekBuckets('alertDate'),
      exhaustionByWeek:weekBuckets('exhaustDate'),
      exhaustionHeatmap:heatmap,
    },
    timeline:[],actionQueue:actionQueue,students:enriched,
  };
}

function createEmptyDashboardData() {
  return {lastUpdatedAt:null,previousUpdatedAt:null,summary:{students:{total:0,notify:0,watch:0,ok:0,nodata:0},packages:{total:0,notify:0,watch:0,ok:0,nodata:0},portfolio:{exhaustedNow:0,risk7:0,risk14:0,risk30:0,noSchedule:0,pendingDeductionBacklog:0,pendingDeductionPackages:0,lowBalanceNoSchedule:0,multiRiskStudents:0},deltas:{packagesNotify:null,packagesWatch:null,risk7:null,risk30:null,pendingDeductionBacklog:null,noSchedule:null}},insights:[],segments:{packageNames:[],parents:[],cadence:[],drivers:[],distribution:[],outreachByWeek:[],exhaustionByWeek:[],exhaustionHeatmap:[]},timeline:[],actionQueue:[],students:[]};
}

var DATA = createEmptyDashboardData();
var isLoading = true, loadError = null;
var currentView = 'command', currentFilter = 'all', currentSearch = '';
var currentSort = {field:'priorityScore',dir:'desc'};
var selectedQueueKey = null, selectedStudentIndex = null;

function escapeHtml(v) {
  return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function formatNumber(v) {
  if(v===null||v===undefined||isNaN(Number(v))) return '-';
  var n=Number(v); return Number.isInteger(n)?String(n):n.toFixed(1);
}
function formatSigned(v,suffix) {
  if(v===null||v===undefined) return 'Baseline';
  var n=Number(v); return (n>0?'+':'')+formatNumber(n)+(suffix||'');
}
function formatDate(d) {
  if(!d) return 'No date';
  return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function formatShortDate(d) {
  if(!d) return 'No date';
  return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function formatDateTime(d) {
  if(!d) return 'No baseline';
  return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}
function statusLabel(s) { return {notify:'Act now',watch:'Watch',ok:'Healthy',nodata:'No data'}[s]||s; }
function flagLabel(f) {
  return {'no-upcoming-sessions':'No future schedule','pending-deduction':'Pending deduction','missing-parent':'Missing parent','exhausted-now':'Exhausted now','duplicate-source-rows':'Duplicate rows','low-balance-no-schedule':'Low + no schedule'}[f]||f;
}
function toneClass(t) { return {'critical':'tone-critical','warning':'tone-warning','attention':'tone-warning','positive':'tone-positive','info':'tone-info'}[t]||'tone-info'; }
function avatarPalette(i) {
  var p=[{bg:'#e7eef9',fg:'#0d3b73'},{bg:'#fff1e7',fg:'#f36a1d'},{bg:'#e8f6ef',fg:'#1d7a4f'},{bg:'#fff6df',fg:'#d28b15'},{bg:'#ede8fa',fg:'#5d43c4'}];
  return p[i%p.length];
}
function getInitials(name) {
  return String(name||'').split(' ').filter(function(n){return n&&n[0]!=='(';}).slice(0,2).map(function(n){return n[0];}).join('').toUpperCase();
}
function hasLoadedData() { return !isLoading&&!loadError; }

function applyLoadedData(payload) {
  DATA = payload||createEmptyDashboardData();
  isLoading=false; loadError=null;
  selectedQueueKey = DATA.actionQueue.length ? DATA.actionQueue[0].key : null;
  if(selectedStudentIndex!==null&&!DATA.students[selectedStudentIndex]) selectedStudentIndex=null;
  renderAll();
}
function handleLoadFailure(error) {
  isLoading=false;
  loadError = error&&error.message?error.message:String(error||'Unknown error');
  renderAll();
}

// ── LOAD FROM Apps Script ─────────────────────────────────────────────
function loadDashboardData() {
  isLoading=true; loadError=null; renderAll();
  if(typeof google==='undefined'||!google.script||!google.script.run) {
    handleLoadFailure('Apps Script runtime unavailable in this context.');
    return;
  }
  google.script.run
    .withSuccessHandler(function(students) {
      try { applyLoadedData(transformToCommandData(students)); }
      catch(e) { handleLoadFailure(e.message||String(e)); }
    })
    .withFailureHandler(handleLoadFailure)
    .getStudentData();
}
function retryLoadData() { loadDashboardData(); }

// ── FILTER / SORT HELPERS ─────────────────────────────────────────────
function worstStatus(packages) {
  if(packages.some(function(p){return p.status==='notify';})) return 'notify';
  if(packages.some(function(p){return p.status==='watch';}))  return 'watch';
  if(packages.some(function(p){return p.status==='ok';}))     return 'ok';
  return 'nodata';
}
function matchesSmartFilter(row,f) {
  if(f==='all') return true;
  if(f==='act-now') return row.status==='notify'||row.adjustedRemaining<=0;
  if(f==='this-week') return row.daysUntilAlert!==null&&row.daysUntilAlert>0&&row.daysUntilAlert<=7;
  if(f==='next-30') return row.daysUntilAlert!==null&&row.daysUntilAlert>7&&row.daysUntilAlert<=30;
  if(f==='missing-data') return row.dataQualityFlags.indexOf('no-upcoming-sessions')!==-1;
  if(f==='recently-worsened') return row.statusChange==='worsened';
  return true;
}
function matchesSearch(row) {
  if(!currentSearch) return true;
  return [row.student,row.parent,row.packageName,row.recommendedAction,row.salesRep||''].join(' ').toLowerCase().indexOf(currentSearch)!==-1;
}
function normalizeDayValue(a,b) { return (a===null?Infinity:a)-(b===null?Infinity:b); }
function normalizeDateValue(a,b) { return (a?new Date(a).getTime():Infinity)-(b?new Date(b).getTime():Infinity); }
function getSortedFilteredQueue() {
  var filtered=DATA.actionQueue.filter(function(r){return matchesSmartFilter(r,currentFilter)&&matchesSearch(r);});
  var dir=currentSort.dir==='asc'?1:-1, field=currentSort.field;
  return filtered.slice().sort(function(a,b){
    if(field==='student') return dir*a.student.localeCompare(b.student);
    if(field==='adjustedRemaining') return dir*(a.adjustedRemaining-b.adjustedRemaining);
    if(field==='pendingDeduction') return dir*(a.pendingDeduction-b.pendingDeduction);
    if(field==='daysUntilAlert') return dir*normalizeDayValue(a.daysUntilAlert,b.daysUntilAlert);
    if(field==='daysUntilExhaust') return dir*normalizeDayValue(a.daysUntilExhaust,b.daysUntilExhaust);
    if(field==='nextSessionDate') return dir*normalizeDateValue(a.nextSessionDate,b.nextSessionDate);
    return dir*(a.priorityScore-b.priorityScore);
  });
}
function getSelectedQueueRow() {
  var q=getSortedFilteredQueue();
  if(!q.length) return null;
  return q.find(function(r){return r.key===selectedQueueKey;})||q[0];
}
function getStudentByIndex(i) { return i===null?null:DATA.students[i]; }
function getSidebarStudents() {
  var keys={};
  getSortedFilteredQueue().forEach(function(r){keys[r.student]=true;});
  return DATA.students.filter(function(s){
    var sp=!currentSearch||[s.student,s.parent].join(' ').toLowerCase().indexOf(currentSearch)!==-1;
    var fp=currentFilter==='all'||keys[s.student];
    return sp&&fp;
  });
}
function getFilterCount(f) { return DATA.actionQueue.filter(function(r){return matchesSmartFilter(r,f);}).length; }

      +'</div>'

      +'<div class="context-block"><h4>Quick actions</h4><div class="btn-row"><button class="action-btn" onclick="openMsgModalByIndex('+row.studentIndex+','+row.packageIndex+')">Preview LINE message</button><button class="ghost-btn" onclick="openStudent('+row.studentIndex+')">Open student detail</button></div></div>'

function renderActionNarrative(row) {
  if(row.status==='notify') return row.adjustedRemaining<=0?'This package is already exhausted. Outreach should confirm renewal immediately.':'The package is already below the threshold, so outreach should happen now.';
  if(row.status==='watch') return row.daysUntilAlert!==null&&row.daysUntilAlert<=7?'This is still pre-alert, but the crossing happens within the week.':'Queue this package for pre-emptive renewal follow-up before it becomes urgent.';
  if(row.dataQualityFlags.indexOf('no-upcoming-sessions')!==-1) return 'Forecast confidence is low. Confirm the schedule before escalating.';
  return 'Keep this package monitored and revisit if the balance deteriorates.';
}
function renderRiskWindowText(row) {
  if(row.adjustedRemaining<=0) return 'Already exhausted';
  if(row.status==='notify') return 'Below 2 credits now';
  if(row.alertDate) return 'Below 2 on '+formatShortDate(row.alertDate);
  if(row.dataQualityFlags.indexOf('no-upcoming-sessions')!==-1) return 'No future sessions';
  return 'No near-term alert';
}
function renderExhaustionText(row) {
  if(!row.exhaustDate) return row.nextSessionDate?'Next '+formatShortDate(row.nextSessionDate):'No projected exhaustion';
  return 'Exhausts '+formatShortDate(row.exhaustDate);
}

function renderSegmentBars(items,key,suffix) {
  if(!items.length) return '<div class="empty-state">No segment data available.</div>';
  var max=Math.max(1,...items.map(function(i){return i[key];}));
  return '<div class="segment-bars">'+items.map(function(item){
    var w=Math.max(6,(item[key]/max)*100);
    return '<div class="segment-row" style="display:block">'
      +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div class="segment-copy"><div class="segment-name">'+escapeHtml(item.name)+'</div><div class="segment-detail">'+(item.totalPackages!==undefined?item.totalPackages+' packages tracked':item.students+' students')+'</div></div><div class="segment-value">'+item[key]+' '+suffix+'</div></div>'
      +'<div class="segment-bar-track" style="margin-top:12px"><div class="segment-bar-fill" style="width:'+w+'%;background:linear-gradient(90deg,var(--navy),var(--orange))"></div></div>'
    +'</div>';
  }).join('')+'</div>';
}
function renderDriverBreakdown(drivers) {
  var max=Math.max(1,...drivers.map(function(d){return d.count;}));
  return '<div class="segment-bars">'+drivers.map(function(d){
    return '<div class="segment-row" style="display:block">'
      +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div class="segment-name">'+escapeHtml(d.name)+'</div><div class="segment-value '+toneClass(d.tone)+'">'+d.count+'</div></div>'
      +'<div class="segment-bar-track" style="margin-top:12px"><div class="segment-bar-fill" style="width:'+Math.max(6,(d.count/max)*100)+'%;background:'+(d.tone==='critical'?'var(--red)':d.tone==='warning'?'var(--yellow)':'var(--navy)')+'"></div></div>'
    +'</div>';
  }).join('')+'</div>';
}
function renderHistogram(buckets) {
  var max=Math.max(1,...buckets.map(function(b){return b.count;}));
  return '<div class="hist-grid">'+buckets.map(function(b){
    return '<div class="hist-cell"><div class="stat-label">'+escapeHtml(b.label)+' cr</div><div class="hist-value">'+b.count+'</div><div class="hist-bar-track" style="margin-top:12px"><div class="hist-bar-fill" style="width:'+Math.max(8,(b.count/max)*100)+'%;background:linear-gradient(90deg,var(--orange),var(--navy))"></div></div></div>';
  }).join('')+'</div>';
}
function renderWeekBars(buckets,color) {
  var max=Math.max(1,...buckets.map(function(b){return b.count;}));
  return '<div class="week-grid">'+buckets.map(function(b){
    return '<div class="week-cell"><div class="stat-label">'+escapeHtml(b.label)+'</div><div class="week-value">'+b.count+'</div><div class="week-bar-track" style="margin-top:12px"><div class="week-bar-fill" style="width:'+Math.max(8,(b.count/max)*100)+'%;background:'+color+'"></div></div><div class="segment-detail" style="margin-top:8px">'+escapeHtml(formatShortDate(b.start))+'-'+escapeHtml(formatShortDate(b.end))+'</div></div>';
  }).join('')+'</div>';
}
function renderHeatmap(cells) {
  if(!cells.length) return '<div class="empty-state">No projected exhaustion dates yet.</div>';
  var max=Math.max(1,...cells.map(function(c){return c.count;}));
  return '<div class="heatmap-grid">'+cells.map(function(c){
    var intensity=c.count===0?0.06:0.16+(c.count/max)*0.56;
    return '<div class="heatmap-cell" title="'+escapeHtml(c.date)+': '+c.count+' packages" style="background:rgba(198,61,49,'+intensity+');color:'+(c.count>0?'white':'var(--ink-soft)')+'">'+new Date(c.date).getDate()+'</div>';
  }).join('')+'</div>';
}

function renderWaterfall(pkg) {
  var safe=Math.max(1,pkg.totalCredits||1);
  var sp=Math.max(0,Math.min(100,(pkg.currentRemaining/safe)*100));
  var pp=Math.max(0,Math.min(100,(pkg.pendingDeduction/safe)*100));
  var ap=Math.max(0,Math.min(100,(pkg.adjustedRemaining/safe)*100));
  return '<div class="waterfall">'
    +'<div class="waterfall-row"><div class="waterfall-label">System balance</div><div class="waterfall-track"><div class="waterfall-fill" style="width:'+sp+'%;background:var(--navy)"></div></div><div class="waterfall-value">'+formatNumber(pkg.currentRemaining)+'</div></div>'
    +'<div class="waterfall-row"><div class="waterfall-label">Pending deduction</div><div class="waterfall-track"><div class="waterfall-fill" style="width:'+pp+'%;background:var(--yellow)"></div></div><div class="waterfall-value">-'+formatNumber(pkg.pendingDeduction)+'</div></div>'
    +'<div class="waterfall-row"><div class="waterfall-label">Actual remaining</div><div class="waterfall-track"><div class="waterfall-fill" style="width:'+ap+'%;background:'+(pkg.adjustedRemaining<2?'var(--red)':pkg.adjustedRemaining<4?'var(--yellow)':'var(--green)')+'"></div></div><div class="waterfall-value">'+formatNumber(pkg.adjustedRemaining)+'</div></div>'
  +'</div>';
}

function renderProjectionTable(pkg) {
  if(!pkg.projection.length) return '<div class="empty-state" style="padding:16px 0">No upcoming sessions for projection.</div>';
  return '<div class="projection-table"><table><thead><tr><th class="no-sort">Date</th><th class="no-sort">Min</th><th class="no-sort">Deduction</th><th class="no-sort">Balance after</th></tr></thead><tbody>'
    +pkg.projection.slice(0,6).map(function(r){
      return '<tr><td class="mono">'+escapeHtml(r.date)+'</td><td>'+r.dur+'</td><td>'+formatNumber(r.deduct)+' cr</td><td>'+formatNumber(r.bal)+' cr</td></tr>';
    }).join('')
  +'</tbody></table></div>';
}

function renderUpcomingSessionRows(student) {
  var rows=[];
  student.packages.forEach(function(pkg){
    (pkg.upcomingSessions||[]).forEach(function(s){rows.push({packageName:pkg.name,date:s.date,durationMin:s.durationMin,deduct:s.deduct});});
  });
  rows.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  if(!rows.length) return '<div class="empty-state">No upcoming sessions are scheduled for this student.</div>';
  return rows.slice(0,10).map(function(r){
    return '<div class="upcoming-row"><div class="segment-copy"><div class="segment-name">'+escapeHtml(r.packageName)+'</div><div class="segment-detail">'+escapeHtml(formatDate(r.date))+'</div></div><div class="segment-value">'+r.durationMin+'m / '+formatNumber(r.deduct)+' cr</div></div>';
  }).join('');
}

// ── MESSAGE MODAL ─────────────────────────────────────────────────────
function buildParentMessage(student,pkg) {
  var studentFirst=getNickname(student.student);
  var parentFirst=String(student.parent||'').split(' ')[0]||'ผู้ปกครอง';
  var refDate=pkg.exhaustDate||pkg.alertDate;
  var monthLabel=refDate?new Date(refDate).toLocaleDateString('th-TH',{month:'long',year:'numeric'}):'เร็วๆ นี้';
  var creditLine,actionLine;
  if(pkg.adjustedRemaining<=0){
    creditLine='ตอนนี้ package "'+pkg.name+'" ของน้อง'+studentFirst+' ใช้เครดิตหมดแล้วค่ะ';
    actionLine='รบกวนติดต่อกลับเพื่อวางแผนต่อ package ให้น้องได้เลยนะคะ เพื่อให้การเรียนต่อเนื่องไม่สะดุดค่ะ';
  } else if(pkg.adjustedRemaining<2){
    creditLine='ตอนนี้ package "'+pkg.name+'" ของน้อง'+studentFirst+' เหลือเครดิตอีกเพียง '+formatNumber(pkg.adjustedRemaining)+' credit เท่านั้นค่ะ';
    actionLine='รบกวนติดต่อกลับเพื่อวางแผนต่อ package ล่วงหน้าได้เลยนะคะ ทางทีมงานพร้อมช่วยดูแลให้น้องเรียนต่อเนื่องค่ะ';
  } else {
    creditLine='ตอนนี้ package "'+pkg.name+'" ของน้อง'+studentFirst+' เหลือเครดิตอีกประมาณ '+formatNumber(pkg.adjustedRemaining)+' credits แล้วค่ะ คาดว่าจะลดลงต่ำกว่าเกณฑ์ในช่วง'+monthLabel;
    actionLine='ทีมงานอยากแจ้งล่วงหน้าเพื่อช่วยวางแผนต่อ package ได้ทันก่อนเครดิตใกล้หมดนะคะ';
  }
  return 'สวัสดีค่ะคุณ'+parentFirst+' 😊\n\nทีมงาน BeGifted ขอแจ้งอัปเดต package การเรียนของน้อง'+studentFirst+' นะคะ\n\n'+creditLine+'\n\n'+actionLine+'\n\nหากต้องการให้ทีมงานช่วยแนะนำ package ที่เหมาะสม สามารถแจ้งกลับมาได้เลยนะคะ ขอบคุณค่ะ 🤍';
}

function openMsgModalByIndex(si,pi) {
  if(!hasLoadedData()) return;
  var student=DATA.students[si], pkg=student&&student.packages?student.packages[pi]:null;
  if(!student||!pkg) return;
  document.getElementById('modal-msg').textContent=buildParentMessage(student,pkg);
  document.getElementById('modal-copy-btn').textContent='Copy message';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function copyMsg(){
  navigator.clipboard.writeText(document.getElementById('modal-msg').textContent);
  document.getElementById('modal-copy-btn').textContent='Copied';
}

function setView(v) {
  if(isLoading||loadError){currentView=v==='student'?'command':v;renderAll();return;}
  if(v==='student'&&selectedStudentIndex===null) currentView='command';
  else currentView=v;
  renderAll();
}
function setFilter(f) {
  if(!hasLoadedData()) return;
  currentFilter=f;
  var first=getSortedFilteredQueue()[0]; selectedQueueKey=first?first.key:null;
  renderAll();
}
function setSearch(v) {
  if(!hasLoadedData()) return;
  currentSearch=String(v||'').trim().toLowerCase();
  var first=getSortedFilteredQueue()[0]; selectedQueueKey=first?first.key:null;
  renderAll();
}
function selectQueue(key) { if(!hasLoadedData()) return; selectedQueueKey=key; renderContent(); }
function openStudent(i) { if(!hasLoadedData()) return; selectedStudentIndex=i; currentView='student'; renderAll(); }
function goCommand() { currentView='command'; renderAll(); }
function toggleSort(field) {
  if(!hasLoadedData()) return;
  if(currentSort.field===field) currentSort.dir=currentSort.dir==='asc'?'desc':'asc';
  else currentSort={field:field,dir:field==='student'?'asc':'desc'};
  renderContent();
}

function renderAll() { renderHeaderState(); renderRail(); renderContent(); }

renderAll();
loadDashboardData();
</script>
</body>
</html>
